[package]
name = "smelt-specialize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Build-time host-runtime specialization (sandboxed partial evaluation) for the Smelt transpiler."
keywords = ["smelt", "specialization", "compiler", "transpiler"]
categories = ["compilers", "development-tools"]

[lints]
workspace = true

[dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# `process_tree`: signal a spawned child's descendants (Linux `/proc` walk).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile = "3.27"
