[package]
name = "smelt-frontend-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Python frontend for the Smelt compiler."
keywords = ["smelt", "python", "compiler", "transpiler"]
categories = ["compilers", "development-tools"]
autoexamples = false
# The complete frontend, including its optional `ty` type-resolution path, is
# publishable: both Ruff's parser crates and ty's library-layer crates come from
# crates.io. The concrete database lives in `smelt-py-types`, avoiding the
# unpublished top-level `ty_project` crate.

[lints]
workspace = true

[features]
default = ["ty"]
# Resolve Python function/method/parameter/closure types via Astral's `ty`
# instead of requiring explicit source annotations (issue #93). ON by default:
# ty-backed resolution is now the standard Python type source, so it is enabled
# out of the box (this pulls in the `ty` dependency tree — salsa + vendored
# typeshed — through `smelt-py-types`). Disable with `--no-default-features` for
# a lean build that requires explicit annotations instead.
ty = ["dep:smelt-py-types"]

[dependencies]
smelt-asyncio = { path = "../smelt-asyncio", version = "0.1.0" }
smelt-hir = { path = "../smelt-hir", version = "0.1.0" }
smelt-specialize = { path = "../smelt-specialize", version = "0.1.0" }
smelt-stdlib = { path = "../smelt-stdlib", version = "0.1.0" }

# Optional `ty`-backed Python type resolution, gated behind the `ty` feature.
smelt-py-types = { path = "../smelt-py-types", version = "0.1.0", optional = true }

# Python parsing via Astral's Ruff parser, pulled from crates.io. These are the
# published `0.0.4` parser crates. Keep these aligned with `smelt-py-types`.
# The frontend boundary nevertheless remains plain `u32` byte offsets so its
# public API does not expose Ruff implementation types.
ruff_python_parser = "0.0.4"
ruff_python_ast    = "0.0.4"
ruff_text_size     = "0.0.4"

[dev-dependencies]
pico-args = "0.5"

[[example]]
name = "py_parser"
path = "examples/parser.rs"

[[example]]
name = "py_print_hir"
path = "examples/print_hir.rs"
