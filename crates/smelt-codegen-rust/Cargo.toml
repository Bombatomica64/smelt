[package]
name = "smelt-codegen-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rust source-code generation from Smelt MIR."
keywords = ["smelt", "codegen", "compiler", "rust", "transpiler"]
categories = ["compilers", "development-tools"]

[lints]
workspace = true

[features]
# Forward the Python frontend's `ty` feature so the compile corpus can exercise
# annotation-free Python that lowers via `ty`-resolved types (issue #93). OFF by
# default so the default build stays lean; CI runs the corpus with `--features
# ty` alongside `--ignored`.
ty = ["smelt-frontend-py/ty"]

[dependencies]
smelt-mir = { path = "../smelt-mir", version = "0.1.0" }
smelt-hir = { path = "../smelt-hir", version = "0.1.0" }
smelt-stdlib = { path = "../smelt-stdlib", version = "0.1.0" }

[dev-dependencies]
insta = "1.48"
smelt-frontend-py = { path = "../smelt-frontend-py" }
smelt-frontend-ts = { path = "../smelt-frontend-ts" }
smelt-specialize = { path = "../smelt-specialize" }
tempfile = "3.27"
