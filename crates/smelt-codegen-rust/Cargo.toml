[package]
name = "smelt-codegen-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rust source-code generation from Smelt MIR."
keywords = ["smelt", "codegen", "compiler", "rust", "transpiler"]
categories = ["compilers", "development-tools"]

[lints]
workspace = true

[features]
default = ["ty"]
# Forward the Python frontend's `ty` feature so the compile corpus exercises
# annotation-free Python that lowers via `ty`-resolved types (issue #93). ON by
# default; the corpus's Python cases now run under a plain `--ignored` run.
# Build with `--no-default-features` to drop the ty dependency tree.
ty = ["smelt-frontend-py/ty"]

[dependencies]
smelt-mir = { path = "../smelt-mir", version = "0.1.1" }
smelt-hir = { path = "../smelt-hir", version = "0.1.1" }
smelt-stdlib = { path = "../smelt-stdlib", version = "0.1.1" }
# Source of truth for the runtime prelude: the helper text emitted into generated
# crates is read from this crate's own compiled, unit-tested modules (see
# `runtime_prelude`). This is a dependency of the *transpiler*, never of the
# crates it generates — those stay self-contained.
smelt-runtime = { path = "../smelt-runtime", version = "0.1.1" }
# Fast, non-DoS-resistant hasher for the CFG reachability hot path: block/local
# ids are dense `u32`s, so SipHash's per-key cost dominated `emit_crate`.
rustc-hash = "2"

[dev-dependencies]
insta = "1.48"
smelt-frontend-py = { path = "../smelt-frontend-py" }
smelt-frontend-ts = { path = "../smelt-frontend-ts" }
smelt-specialize = { path = "../smelt-specialize" }
tempfile = "3.27"
