[package]
name = "smelt-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Runtime helpers that Rust programs transpiled by Smelt depend on."
keywords = ["smelt", "runtime", "transpiler"]
categories = ["development-tools"]

# ---------------------------------------------------------------------------
# Lint policy: deliberately NOT `workspace = true`.
# ---------------------------------------------------------------------------
# The marked regions in `src/**` are emitted verbatim into every generated
# crate, so their text is generated output rather than ordinary crate-internal
# Rust. A lint that can only be satisfied by rewriting that text would change
# the bytes of every generated crate, which is not this crate's decision to
# make. So the correctness-bearing groups stay denied and the style-only groups
# are demoted to warnings, each relaxation justified below.
#
# Keep this table in step with `[workspace.lints]` in the root Cargo.toml when
# that policy changes.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# The runtime items exist to be emitted, not called from this crate, so almost
# every one of them is dead code here. `#[allow]`/`#[expect]` attributes cannot
# express that (they would become part of the emitted text), which is why this
# is a lint-table entry.
dead_code = "allow"
# Generated crates set `#![allow(non_snake_case)]`; item text may follow source
# spelling rather than Rust naming.
non_snake_case = "allow"
elided_lifetimes_in_paths = "warn"
keyword_idents = { level = "deny", priority = -1 }
non_ascii_idents = "deny"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }

[lints.clippy]
# Correctness, suspicious, style, complexity and perf stay hard errors: these
# are the lints that would find real bugs in a runtime helper.
all = { level = "deny", priority = -1 }
# Stylistic groups are warnings here. Satisfying them (e.g. `must_use`
# attributes, doc-comment shape, `#[inline]`) would edit emitted text.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Generated crates are compiled by the *user's* toolchain, where an `#[expect]`
# whose lint does not fire is itself a warning. Emitted text therefore uses
# `#[allow]`, and this crate holds that text verbatim.
allow_attributes = "allow"
allow_attributes_without_reason = "allow"
# Two `clippy::all` members can only be satisfied by rewriting emitted text:
# `type_complexity` wants a `type` alias for the shared-capture registry map, and
# `clone_on_ref_ptr` wants `Rc::clone(&x)` spelled explicitly. Both are real
# cleanups, and both change the bytes of every generated crate, so they belong to
# a deliberate emitted-text change rather than to this source-of-truth move.
type_complexity = "allow"
clone_on_ref_ptr = "allow"
# Three more apply at the workspace MSRV but not to a generated crate, whose floor
# is lower, and rewriting them changes the same bytes. Kept as warnings so the
# clippy ratchet still counts them.
collapsible_if = "warn"
chunks_exact_to_as_chunks = "warn"
manual_is_multiple_of = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
str_to_string = "deny"
string_add = "deny"
map_err_ignore = "deny"
missing_assert_message = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
pub_without_shorthand = "deny"

[features]
default = ["compiled"]
# Builds the runtime text as a module of this crate. The emitter only reads the
# text, so it turns this off and never links any of the crates below.
compiled = [
    "dep:base64",
    "dep:bytes",
    "dep:chrono",
    "dep:chrono-tz",
    "dep:fancy-regex",
    "dep:genawaiter",
    "dep:getrandom",
    "dep:hmac",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:indexmap",
    "dep:md-5",
    "dep:num-bigint",
    "dep:num-integer",
    "dep:num-traits",
    "dep:rand",
    "dep:regex",
    "dep:regress",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:serde",
    "dep:serde_json",
    "dep:sha1",
    "dep:sha2",
    "dep:tokio",
    "dep:unicode-normalization",
    "dep:url",
    "dep:uuid",
]

# The crates a generated crate links, at the versions it declares
# (`smelt_stdlib::BackendDependency::cargo_dependency`).
[dependencies]
base64 = { version = "0.22", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
chrono-tz = { version = "0.10", optional = true }
fancy-regex = { version = "0.14", optional = true }
genawaiter = { version = "0.99.1", optional = true }
getrandom = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server"], optional = true }
indexmap = { version = "2", optional = true }
md-5 = { version = "0.10", optional = true }
num-bigint = { version = "0.4", optional = true }
num-integer = { version = "0.1", optional = true }
num-traits = { version = "0.2", optional = true }
rand = { version = "0.9", optional = true }
regex = { version = "1", optional = true }
regress = { version = "0.10", features = ["utf16"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["macros", "rt", "time", "net", "sync"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
