[package]
name = "smelt-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "GPUI desktop playground for the Smelt transpiler: edit TypeScript/Python and watch it lower to Rust."
keywords = ["smelt", "gui", "gpui", "transpiler", "playground"]
categories = ["development-tools", "gui"]

[[bin]]
name = "smelt-gui"
path = "src/main.rs"

[features]
# Python frontend support. ON by default; the complete frontend is publishable.
default = ["python"]
python = ["dep:smelt-frontend-py"]

[dependencies]
gpui = "0.2.2"
smelt-frontend-ts = { path = "../smelt-frontend-ts", version = "0.1.0" }
smelt-frontend-py = { path = "../smelt-frontend-py", version = "0.1.0", optional = true }
smelt-hir = { path = "../smelt-hir", version = "0.1.0" }
smelt-mir = { path = "../smelt-mir", version = "0.1.0" }
smelt-codegen-rust = { path = "../smelt-codegen-rust", version = "0.1.0" }
gpui-component = "0.5.1"

[lints]
workspace = true
