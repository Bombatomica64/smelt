# smelt-gui is its own workspace, deliberately split out of the main Smelt
# workspace: it depends on gpui (a very slow cold build) and is not part of the
# transpiler pipeline. It consumes the published smelt-* crates from crates.io
# rather than path deps, so building the main workspace never touches gpui.
#
# Build it explicitly from this directory:
#   cargo run --manifest-path crates/smelt-gui/Cargo.toml
[workspace]

[package]
name = "smelt-gui"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Bombatomica64/smelt"
homepage = "https://github.com/Bombatomica64/smelt"
authors = ["Lorenzo Micheli"]
description = "GPUI desktop playground for the Smelt transpiler: edit TypeScript/Python and watch it lower to Rust."
keywords = ["smelt", "gui", "gpui", "transpiler", "playground"]
categories = ["development-tools", "gui"]

[[bin]]
name = "smelt-gui"
path = "src/main.rs"

[features]
# Python frontend support. ON by default; the complete frontend is publishable.
default = ["python"]
python = ["dep:smelt-frontend-py"]

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
# Published Smelt crates from crates.io (not path deps) — this is what keeps gui
# out of the main workspace's build graph.
smelt-frontend-ts = "0.1.1"
smelt-frontend-py = { version = "0.1.1", optional = true }
smelt-hir = "0.1.1"
smelt-mir = "0.1.1"
smelt-codegen-rust = "0.1.1"

# Transitive pin (not used directly): the ty Python stack pulls get-size2, and
# the two must agree or `ruff_python_ast`'s `GetSize` derive sees two
# `compact_str` versions and fails. The main workspace resolves get-size2 at
# 0.10.3 since the Ruff/ty 0.0.10 bump; match it here.
#
# NOTE: smelt-gui is excluded from the workspace and is not built by CI, so this
# pin is kept in sync by inspection rather than by a build.
get-size2 = "=0.10.3"
