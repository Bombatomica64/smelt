[package]
name = "smelt-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "GPUI desktop playground for the Smelt transpiler: edit TypeScript/Python and watch it lower to Rust."
keywords = ["smelt", "gui", "gpui", "transpiler", "playground"]
categories = ["development-tools", "gui"]

[[bin]]
name = "smelt-gui"
path = "src/main.rs"

[features]
# Python frontend support. ON by default. `smelt-frontend-py`'s Ruff parser now
# comes from crates.io, so this parser-based Python path is publishable and the
# crates.io release KEEPS `python` (see `scripts/publish-crates.sh`). Only the
# `ty` type-resolution path (git-only `ty_project` tree) is excluded from the
# release; the GUI does not expose a `ty` feature, so nothing to strip here
# beyond giving the `smelt-frontend-py` dep a crates.io version at publish time.
default = ["python"]
python = ["dep:smelt-frontend-py"]

[dependencies]
gpui = "0.2.2"
smelt-frontend-ts = { path = "../smelt-frontend-ts", version = "0.1.0" }
smelt-frontend-py = { path = "../smelt-frontend-py", optional = true }
smelt-hir = { path = "../smelt-hir", version = "0.1.0" }
smelt-mir = { path = "../smelt-mir", version = "0.1.0" }
smelt-codegen-rust = { path = "../smelt-codegen-rust", version = "0.1.0" }
gpui-component = "0.5.1"

[lints]
workspace = true
