[package]
name = "smelt-hir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Shared high-level IR (HIR) types and validation for the Smelt transpiler."
keywords = ["smelt", "hir", "compiler", "ir", "transpiler"]
categories = ["compilers", "development-tools"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# The shared stdlib REGISTRY. HIR already models stdlib concepts (`ByteArrayOp`,
# `Base64Op`, `UriTranscodeOp`), and where one of them needs the element table —
# a `DataView` accessor's width and signedness — it names
# `smelt_stdlib::TypedArrayElement` rather than copying it: two element tables
# is what the registry exists to prevent. `smelt-stdlib` is a leaf crate (serde
# only), so this adds no cycle and no build weight.
smelt-stdlib = { path = "../smelt-stdlib", version = "0.1.1" }
