[package]
name = "smelt-ts-types"
version.workspace = true
edition.workspace = true
# tsrs pins its own toolchain (1.99.1) and `rust-version = "1.99"`; this crate
# cannot build on the workspace MSRV.
rust-version = "1.99"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TypeScript 7 type facts for Smelt's TypeScript frontend, resolved by the tsrs checker."
keywords = ["smelt", "typescript", "types", "compiler", "transpiler"]
categories = ["compilers", "development-tools"]
# The tsrs crates are `publish = false` upstream and only reachable as a git
# dependency, which crates.io rejects. Until tsrs publishes (or Smelt vendors
# it), this crate and the frontend feature that pulls it in stay unpublished.
publish = false

[lints]
workspace = true

# One pinned tsrs commit for every tsrs crate. tsrs ports microsoft/TypeScript
# 3e9236361fa9 (TypeScript 7.1.0-beta); bump every `rev` together.
[dependencies]
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }
tsrs_checker = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", rev = "89923ab51c0192363d1f1d2f5b1b275e9c8b463b" }

[dev-dependencies]
# The frontend parses with oxc; the tests prove oxc spans address tsrs nodes.
oxc = { version = "0.147.0", features = ["ast_visit"] }
