[package]
name = "smelt-ts-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TypeScript 7 type facts for Smelt's TypeScript frontend, resolved by the tsrs checker."
keywords = ["smelt", "typescript", "types", "compiler", "transpiler"]
categories = ["compilers", "development-tools"]
# The tsrs crates are `publish = false` upstream and only reachable as a git
# dependency, which crates.io rejects. Until tsrs publishes (or Smelt vendors
# it), this crate and the frontend feature that pulls it in stay unpublished.
publish = false

[lints]
workspace = true

# One pinned tsrs commit for every tsrs crate. tsrs ports microsoft/TypeScript
# 3e9236361fa9 (TypeScript 7.1.0-beta); bump every `rev` together.
[dependencies]
smelt-ts-model = { path = "../smelt-ts-model", version = "0.1.1" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }
tsrs_checker = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", rev = "6ff1ff6723e45ec63e86796a880db3d3c6e41df1" }

[dev-dependencies]
# The frontend parses with oxc; the tests prove oxc spans address tsrs nodes.
oxc = { version = "0.157.0", features = ["ast_visit"] }
