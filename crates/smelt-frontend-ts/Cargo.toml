[package]
name = "smelt-frontend-ts"
version.workspace = true
edition.workspace = true
autoexamples = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TypeScript frontend for the Smelt transpiler: lowers strict TypeScript to Smelt HIR via oxc."
keywords = ["smelt", "typescript", "frontend", "compiler", "transpiler"]
categories = ["compilers", "development-tools"]

[lints]
workspace = true

[dependencies]
smelt-hir = { path = "../smelt-hir", version = "0.1.1" }
smelt-specialize = { path = "../smelt-specialize", version = "0.1.1" }
smelt-stdlib = { path = "../smelt-stdlib", version = "0.1.1" }
oxc = { version = "0.147.0", features = ["semantic", "ast_visit"] }

[dev-dependencies]
pico-args = "0.5"

[[example]]
name = "ts_parser"
path = "examples/parser.rs"

[[example]]
name = "ts_print_hir"
path = "examples/print_hir.rs"
