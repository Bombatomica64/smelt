name: Library Probes

# Daily transpile probes against pinned third-party TypeScript/Python libraries.
# Tracks how far Smelt can transpile real-world "bug libraries" over time and
# writes the result to blocker-logs/library-probes.md. This is independent of
# the regression CI; it never fails the build, it just refreshes the report.

permissions:
  contents: write

on:
  schedule:
    # 06:17 UTC every day.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

# Serialize: this job ends in a git-auto-commit push to main, so two overlapping
# runs (cron plus a manual dispatch) would race on `git push` and one report
# would be lost. Never cancel in progress — a half-finished probe commits
# nothing, so letting the first run finish is strictly better.
concurrency:
  group: library-probes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Smelt
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No native GUI libraries are installed here on purpose: this job only
      # ever builds `--bin smelt` (the fallback path below), and smelt-gui is
      # excluded from the workspace (see `exclude` in the root Cargo.toml), so
      # gpui and its xcb/xkbcommon dev packages are never involved.

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Get smelt binary (prebuilt only if it matches this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The smelt-nightly asset is published on demand (see
          # .github/workflows/publish-smelt.yml), so it can be arbitrarily older
          # than the commit checked out here. Probing with an old binary would
          # produce blocker/pass counts that do not describe this commit and then
          # auto-commit them as if they did, so the asset is only usable when its
          # `smelt.sha` sidecar matches $GITHUB_SHA exactly. Anything else --
          # stale asset, missing sidecar, download failure -- builds from source.
          # The probe script reads $SMELT_BIN.
          mkdir -p .smelt-bin
          asset_sha=""
          if gh release download smelt-nightly \
               --pattern smelt --pattern smelt.sha \
               --dir .smelt-bin --clobber 2>/dev/null; then
            asset_sha="$(tr -d '[:space:]' < .smelt-bin/smelt.sha 2>/dev/null || true)"
          fi

          if [ -n "$asset_sha" ] && [ "$asset_sha" = "$GITHUB_SHA" ]; then
            chmod +x .smelt-bin/smelt
            echo "SMELT_BIN=$PWD/.smelt-bin/smelt" >> "$GITHUB_ENV"
            echo "::notice::Using PREBUILT smelt from smelt-nightly (asset commit $asset_sha matches this commit)."
          else
            echo "::notice::Building smelt FROM SOURCE: smelt-nightly asset commit '${asset_sha:-<none>}' does not match this commit $GITHUB_SHA."
            cargo build --release --bin smelt
            echo "SMELT_BIN=$PWD/target/release/smelt" >> "$GITHUB_ENV"
          fi

      # The checkouts live in RUNNER_TEMP, never under `target/`: `target/` is
      # restored by the cargo cache above, which brings the probe checkouts'
      # `.git` directories back without their worktrees. The old inline version
      # of this step checked out into `target/library-probes` and skipped the
      # clone whenever `<dest>/.git` existed, so from 2026-08-07 it silently
      # skipped all 12 clones and the probe published an all-failed report.
      - name: Check out probed libraries at pinned refs
        run: |
          python3 scripts/checkout_probe_libraries.py \
            --config .github/compat/libraries.json \
            --work-dir "$RUNNER_TEMP/library-probes"

      # Fails without touching the report if any library is missing or scans
      # zero files, so a broken probe never auto-commits over real measurements.
      - name: Run probes and generate report
        run: |
          python3 scripts/probe_libraries.py \
            --config .github/compat/libraries.json \
            --fixtures .github/compat \
            --work-dir "$RUNNER_TEMP/library-probes" \
            --output blocker-logs/library-probes.md

      # A probe run takes ~10 minutes and CI's coverage job also auto-commits to
      # main, so the branch tip can move underneath us: run 31954553437 lost a
      # complete, correct report to `! [rejected] main -> main (non-fast-forward)`
      # because a coverage commit landed three minutes before the push. The
      # commit action fetches but never rebases, so replay the report on top of
      # the current tip first (--autostash keeps the file we just wrote).
      - name: Rebase onto the current branch tip
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: Commit report
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(ci): update library probe report"
          file_pattern: blocker-logs/library-probes.md
