name: Compatibility

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      run_compat:
        description: "Run compatibility jobs and update COMPAT.md"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Serialize: `update-compat` pushes COMPAT.md to main, so two overlapping
# dispatches would race on `git push`. Never cancel in progress — a cancelled
# matrix leg would make `update-compat` publish a partial report.
concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  compat:
    if: ${{ github.event.inputs.run_compat == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: remeda
            url: https://github.com/remeda/remeda.git
            ref: 3c80f28bb394edbf89f1fc9978571dec8ed20edc
            manifest: Smelt.toml
            generated_manifest: dist-smelt/Cargo.toml
          - name: es-toolkit
            url: https://github.com/toss/es-toolkit.git
            ref: e008a2818cd8d07469a5cc12ee0c02405d523e07
            manifest: Smelt.toml
            generated_manifest: dist-smelt/Cargo.toml
    steps:
      - name: Checkout Smelt
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Get smelt binary (prebuilt only if it matches this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The smelt-nightly asset is published on demand (see
          # .github/workflows/publish-smelt.yml), so it can be arbitrarily older
          # than the commit checked out here. This workflow commits COMPAT.md, so
          # a stale binary would publish compatibility numbers that describe some
          # other commit. The asset is therefore only usable when its `smelt.sha`
          # sidecar matches $GITHUB_SHA exactly; stale asset, missing sidecar, or
          # download failure all fall back to a from-source build.
          mkdir -p .smelt-bin
          asset_sha=""
          if gh release download smelt-nightly \
               --pattern smelt --pattern smelt.sha \
               --dir .smelt-bin --clobber 2>/dev/null; then
            asset_sha="$(tr -d '[:space:]' < .smelt-bin/smelt.sha 2>/dev/null || true)"
          fi

          if [ -n "$asset_sha" ] && [ "$asset_sha" = "$GITHUB_SHA" ]; then
            chmod +x .smelt-bin/smelt
            echo "SMELT_BIN=$PWD/.smelt-bin/smelt" >> "$GITHUB_ENV"
            echo "::notice::Using PREBUILT smelt from smelt-nightly (asset commit $asset_sha matches this commit)."
          else
            echo "::notice::Building smelt FROM SOURCE: smelt-nightly asset commit '${asset_sha:-<none>}' does not match this commit $GITHUB_SHA."
            cargo build --release --bin smelt
            echo "SMELT_BIN=$PWD/target/release/smelt" >> "$GITHUB_ENV"
          fi

      - name: Checkout compatibility repo
        run: |
          repo_dir="target/compat-repos/${{ matrix.name }}"
          rm -rf "$repo_dir"
          git clone --no-tags --filter=blob:none "${{ matrix.url }}" "$repo_dir"
          git -C "$repo_dir" checkout "${{ matrix.ref }}"

      - name: Copy Smelt fixtures
        run: |
          fixture_dir=".github/compat/${{ matrix.name }}"
          repo_dir="target/compat-repos/${{ matrix.name }}"
          if [ -d "$fixture_dir" ]; then
            cp -R "$fixture_dir"/. "$repo_dir"/
          fi

      - name: Build and run generated Rust tests
        id: generated-tests
        continue-on-error: true
        run: |
          mkdir -p "target/compat-reports"
          "$SMELT_BIN" rust-test-report \
            --build-manifest "target/compat-repos/${{ matrix.name }}/${{ matrix.manifest }}" \
            --cargo-manifest "target/compat-repos/${{ matrix.name }}/${{ matrix.generated_manifest }}" \
            --full \
            --diagnostics \
            --suppress-warnings \
            --output "target/compat-reports/${{ matrix.name }}.md"

      - name: Write compatibility metadata
        if: always()
        run: |
          result_dir="target/compat-results/${{ matrix.name }}"
          mkdir -p "$result_dir"
          if [ -f "target/compat-reports/${{ matrix.name }}.md" ]; then
            cp "target/compat-reports/${{ matrix.name }}.md" "$result_dir/report.md"
          fi
          {
            echo "name=${{ matrix.name }}"
            echo "url=${{ matrix.url }}"
            echo "ref=${{ matrix.ref }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "status=${{ steps.generated-tests.outcome }}"
          } > "$result_dir/metadata.env"

      - name: Upload compatibility result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-${{ matrix.name }}
          path: target/compat-results/${{ matrix.name }}

  update-compat:
    if: ${{ always() && github.event.inputs.run_compat == 'true' }}
    needs: compat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Smelt
        uses: actions/checkout@v6

      - name: Download compatibility results
        uses: actions/download-artifact@v7
        with:
          path: target/compat-results
          pattern: compat-*

      - name: Update COMPAT.md
        run: |
          # download-artifact extracts a single matched artifact directly into
          # the target path (no per-artifact subdirectory), so locate every
          # metadata.env at any depth instead of assuming one fixed layout, and
          # fail loudly when none are found rather than silently committing
          # nothing (the nullglob loop previously skipped zero matches).
          found=0
          while IFS= read -r metadata; do
            found=1
            result_dir="$(dirname "$metadata")"
            echo "Updating COMPAT.md from $metadata"
            . "$metadata"
            python3 scripts/update_compat.py \
              --compat COMPAT.md \
              --name "$name" \
              --url "$url" \
              --ref "$ref" \
              --run-url "$run_url" \
              --report "$result_dir/report.md" \
              --status "$status"
          done < <(find target/compat-results -name metadata.env | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::no compat metadata.env found under target/compat-results"
            find target/compat-results -maxdepth 3 -print || true
            exit 1
          fi

      - name: Commit compatibility updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(ci): update compatibility report"
          file_pattern: COMPAT.md
