name: CI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    # Documentation-only changes cannot affect any gate in this workflow, so
    # skip the whole Rust matrix (~20 min of runner time) for them. Everything
    # a gate reads is deliberately absent from this list: crates/**,
    # Cargo.{toml,lock}, .github/**, scripts/**, third_party/**, and the
    # blocker-logs/*.json baselines (es-toolkit ratchet + SmeltUnknown).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '*.svg'
      - 'coverage-summary.json'
      - 'lcov.info'
  pull_request:
    # `main` is the merge target that matters, but a *stacked* PR (one whose base
    # is the branch below it in a chain) would otherwise get no CI at all: a
    # `pull_request` trigger only fires for the base branches named here. A
    # stacked PR with zero checks is unreviewable, so `claude/**` is included as
    # a base too. Those runs test the stacked head against its parent branch,
    # which is exactly the diff under review; the same jobs re-run against `main`
    # once the chain is flattened and the PR is retargeted.
    branches: [ main, 'claude/**' ]
    # `labeled` is required so that applying the `run-regressions` label starts a
    # run; `synchronize` keeps the regression jobs re-running on every later push
    # while the label is still applied. Naming `types` at all means the three
    # defaults must be respelled — omitting the key implies
    # [opened, synchronize, reopened].
    types: [ opened, synchronize, reopened, labeled ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '*.svg'
      - 'coverage-summary.json'
      - 'lcov.info'

# Supersede in-flight runs for the same branch. Restricted to pull requests on
# purpose: cancelling a `main` push run would skip the es-toolkit regression
# gate and the coverage-report commit for that commit, so main pushes always
# run to completion even when several land back to back.
#
# `labeled` events are excluded from cancellation. Without that exclusion,
# applying ANY label to a PR would land in this group and cancel a legitimate
# in-flight run for the same ref — and because the label run deliberately skips
# coverage/corpus/clippy (see their `if:`), the PR would be left with no result
# for those checks at all until the next push. A label event may therefore never
# cancel anything; a subsequent push still cancels the label run, which is
# correct because that run tested older code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

jobs:
  # Lint gate. The lint policy itself lives in the repo, not here:
  # `[workspace.lints.rust]` / `[workspace.lints.clippy]` in Cargo.toml already
  # set clippy::{all,pedantic,nursery} to "deny" plus a large hand-picked
  # restriction set, and clippy.toml tightens the thresholds. This job just runs
  # that policy over every target (`--all-targets`, i.e. including the inline
  # test modules that `--lib` skips) and escalates the remaining "warn"-level
  # lints with `-D warnings`.
  #
  # Cache: restores the plain "build" lane but never saves it (`save-if: false`).
  # `cargo clippy` compiles *dependencies* with real rustc — only workspace
  # crates go through clippy-driver — so restoring the lane gives this job warm
  # third-party artifacts for free. Saving would be actively harmful: whichever
  # job wins the race writes the shared lane, and a clippy-driver-fingerprinted
  # target dir would force the corpus/regression jobs to recompile.
  clippy:
    # Skip on `labeled`: that event exists only to let a maintainer opt a PR into
    # the regression jobs below, and re-running this 1-2 min lint (plus coverage
    # and corpus) for every unrelated label added to any PR is pure waste. On
    # `push` there is no `action`, so the expression is true and the job runs.
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: false

      # ADVISORY UNTIL THE WARNING BACKLOG IS CLEARED — then delete the
      # `continue-on-error` line below and this comment, nothing else.
      #
      # `cargo clippy --all-targets` reports 0 ERRORS as of the commit that added
      # this job, and Cargo.toml's deny levels keep it that way: any new denied
      # lint fails the step regardless of `-D warnings`. What is not yet clean is
      # the pre-existing warn-level backlog — 418 sites, led by as_conversions
      # (100), indexing_slicing (68), expect_used (64), the shadow_* family (120)
      # and arithmetic_side_effects (42). None of it was ever enforced, because
      # until now no CI job ran clippy at all.
      #
      # Failing here immediately would leave main red with no branch protection to
      # stop anyone merging through it, which makes a genuine regression
      # indistinguishable from the backlog. So the step reports and does not gate:
      # the full list stays visible in the job log, and the ratchet becomes real
      # once the cleanup lands. See blocker-logs/ci-optimization.md for the
      # phased plan.
      - name: Clippy (all targets, warnings are errors)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

  # Slow tier: compile the emitted-Rust corpus. This is a plain (non-instrumented)
  # build on stable, so it runs as its own job in parallel with coverage and shares
  # the "build" cache lane with the other plain-build workflows. It does not need the
  # nightly toolchain, cargo-llvm-cov, or the GUI native libs (it only builds
  # smelt-codegen-rust and its dependencies, not smelt-gui).
  corpus:
    # See the note on `clippy`: never re-run just because a label was added.
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      # One step, both tiers: the harness runs the two `#[ignore]`d tests in
      # parallel and they share the emitted-crate dependency build, so a single
      # invocation is ~158s where two sequential steps are ~213s (inline corpus
      # 63s + rescued callback-generics fixtures 150s, each paying for its own
      # scratch target dir). Failures are attributed by test name in the output.
      - name: Compile emitted-Rust corpus + rescued fixtures (slow tier)
        run: |
          cargo test -p smelt-codegen-rust --test compile_corpus -- --ignored

      # The *generated* callback-generics shape grid, fast tier only: a greedy
      # pairwise covering subset (75 of the 467 legal shapes) in which every
      # pair of axis values that occurs anywhere in the grid occurs at least
      # once. ~95s. The whole grid is ~10 min and runs nightly instead, in
      # .github/workflows/shape-grid.yml — a slow tier on every PR is a tier
      # that gets disabled.
      #
      # Separate step because it is a separate test binary; it reuses this
      # job's warm workspace build, and only the emitted crates' shared
      # dependency build is paid again.
      - name: Callback-generics shape grid (fast pairwise tier)
        run: |
          cargo test -p smelt-codegen-rust --test shape_grid -- --ignored shape_grid_fast

  # Sandbox gate: proves the fail-closed specialization boundary actually
  # executes, rather than skipping itself into a green result.
  #
  # The sandbox-backed tests skip when `bwrap`, `prlimit`, or a guest runtime is
  # missing, because developer machines rarely have them. That skip used to be
  # spelled `return Ok(())`, which is indistinguishable from a pass — so every
  # one of these tests reported success in CI while never launching a guest
  # process. See gap 3 of blocker-logs/test-coverage-analysis.md.
  #
  # `SMELT_REQUIRE_SANDBOX=1` turns a missing prerequisite into a failure, so
  # this job is red exactly when the boundary is not being exercised. It is a
  # separate job on purpose: a runner-side sandbox regression should surface as
  # one clearly-named failure rather than taking coverage and clippy with it.
  sandbox:
    # See the note on `clippy`: never re-run just because a label was added.
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Install sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
          # which bubblewrap needs. The key is absent on older images.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install --global typescript@5.9.3

      # Fails the job early with a readable message if the runner cannot create
      # the namespaces bubblewrap needs, instead of leaving that to a Rust test.
      #
      # This binds all of `/` read-only on purpose. It is a smoke test of
      # "can bwrap unshare and exec a guest here", NOT the production sandbox
      # posture — the real policy comes from `SandboxPolicyRecord` and binds
      # only its own read-only roots. Enumerating those roots by hand here is
      # what broke the first attempt: binding /usr, /bin, and /lib but not
      # /lib64 left the dynamic loader missing, and exec fails with a bare
      # "No such file or directory" that points at the wrong thing entirely.
      - name: Verify the hard sandbox can start a guest
        run: |
          bwrap --die-with-parent --new-session --unshare-all --cap-drop ALL \
                --clearenv --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
                /bin/echo "hard sandbox is functional"

      - name: Specialization tests (skipping forbidden)
        env:
          SMELT_REQUIRE_SANDBOX: "1"
        run: |
          cargo test -p smelt-specialize
          cargo test -p smelt-codegen-rust \
            --test python_specialization_parity \
            --test typescript_specialization_parity

  coverage:
    # See the note on `clippy`. This one matters most: coverage is the critical
    # path at 6 min 18 s, so without this guard every label added to any PR would
    # burn a full 6-minute run for nothing.
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install nightly Rust (for branch coverage)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      # No native GUI libraries are installed here on purpose: smelt-gui is
      # excluded from the workspace (see `exclude` in the root Cargo.toml), so
      # `--workspace` can never reach gpui and the xcb/xkbcommon dev packages
      # are never linked. Re-add them only if smelt-gui rejoins the workspace.

      # DELIBERATELY NO `Swatinem/rust-cache` STEP HERE. Please do not re-add one.
      #
      # This job builds through `cargo +nightly`, and `dtolnay/rust-toolchain@nightly`
      # above is unpinned, so it resolves a new nightly roughly every day.
      # rust-cache hashes the resolved rustc version into its cache key, so the
      # key rotated daily while the cached artifacts were also invalidated daily
      # by the very same rustc change. The lane could therefore never hit.
      #
      # Measured on run 30451649094 (and confirmed identical on the PR run
      # 30451166101): the restore reported success, then cargo recompiled all
      # 324 units from `unicode-ident` upward — a fully cold instrumented build
      # in both cases. The lane cost ~10 s to restore + ~11-13 s to save and
      # returned nothing, while occupying ~664 MB of the repo cache budget per
      # ref. `cache-bin: true` was inert too: `taiki-e/install-action` fetches a
      # prebuilt cargo-llvm-cov musl binary in ~0.4 s.
      #
      # Re-adding a cache here only pays off together with a *pinned* nightly
      # (e.g. `nightly-YYYY-MM-DD`), which was considered and rejected to avoid
      # the recurring manual toolchain bump. See blocker-logs/ci-optimization.md.

      - name: Install coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Without these the sandbox-backed specialization tests skip themselves,
      # and `smelt-specialize` reports ~50% line / ~36% branch coverage for code
      # that never ran. `SMELT_REQUIRE_SANDBOX` is deliberately NOT set here: a
      # runner-side sandbox quirk should not blank the coverage badge. The
      # `sandbox` job below is the one that enforces non-skipping.
      - name: Install sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
          # which bubblewrap needs. The key is absent on older images, so this
          # must not fail the job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install --global typescript@5.9.3

      - name: Test with coverage
        run: |
          cargo +nightly llvm-cov --workspace --branch --lcov --output-path lcov.info

      - name: Coverage summary (JSON)
        run: |
          cargo +nightly llvm-cov report --branch --json --summary-only --output-path coverage-summary.json

      - name: Generate badge
        run: |
          bash scripts/coverage_badge.sh lcov.info coverage.svg

      - name: Update README coverage tables
        run: |
          python3 scripts/update_readme_coverage.py coverage-summary.json README.md lcov.info

      - name: Commit coverage updates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md coverage-summary.json coverage.svg lcov.info coverage-functions.svg coverage-lines.svg coverage-regions.svg coverage-branches.svg
          git diff --quiet --cached && echo "No coverage updates to commit." || git commit -m "chore(ci): update coverage report"

      - name: Push coverage updates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git push

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.svg
            coverage-summary.json
            coverage-functions.svg
            coverage-lines.svg
            coverage-regions.svg
            coverage-branches.svg

  # NOTE: the `publish-smelt` job that used to live here has moved to its own
  # dispatch-only workflow, .github/workflows/publish-smelt.yml. It cost ~5.5 min
  # of runner time on every push to main while its only consumers are a daily
  # cron (library-probes) and a manual dispatch (compat), so it is now published
  # on demand. Consumers verify the asset's source commit and fall back to a
  # from-source build on mismatch, so an out-of-date asset can never be used
  # silently.

  # Regression gate: transpile the Remeda library at a pinned ref with the smelt
  # built from THIS commit, then compile and run its generated Rust test suite.
  # The whole corpus currently passes (1789 tests); this job fails if a codegen,
  # frontend, or MIR change regresses any of them. Builds smelt from source (not
  # the smelt-nightly asset) so pull requests are gated against their own code.
  # ==========================================================================
  # OPT-IN ON PULL REQUESTS — READ THIS BEFORE MERGING A CODEGEN CHANGE
  #
  # The three library regression gates below (remeda / radash / es-toolkit) do
  # NOT run on a pull request unless the PR carries the `run-regressions` label.
  # They DO run unconditionally on every push to main.
  #
  # If your PR touches the frontend, HIR, MIR, specializer, or the Rust emitter,
  # add the `run-regressions` label and wait for them. A green PR without that
  # label has NOT been checked against Remeda (1789 tests), Radash (84 tests) or
  # the es-toolkit ratchet, and main is not branch-protected, so nothing else
  # will stop a regression from landing.
  #
  # Once applied, the label sticks: every later push to the PR re-runs them.
  # Rationale: ~7 min of runner time per PR run for three jobs that sit well
  # inside the coverage critical path, so skipping them saves runner minutes on
  # docs/CI-only PRs without making anyone wait longer.
  # ==========================================================================
  remeda-regression:
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out Remeda at the pinned ref + copy Smelt fixtures
        run: |
          repo_dir="target/compat-repos/remeda"
          rm -rf "$repo_dir"
          git clone --no-tags --filter=blob:none https://github.com/remeda/remeda.git "$repo_dir"
          git -C "$repo_dir" checkout 3c80f28bb394edbf89f1fc9978571dec8ed20edc
          cp -R .github/compat/remeda/. "$repo_dir"/

      - name: Transpile Remeda to Rust
        run: target/debug/smelt --manifest-path target/compat-repos/remeda/Smelt.toml build

      - name: Compile and run generated Remeda tests (regression gate)
        run: cargo test --manifest-path target/compat-repos/remeda/dist-smelt/Cargo.toml --no-fail-fast

      # Advisory SmeltUnknown metric: classify generated erasure and surface any
      # rise in avoidable erasure against remeda's OWN committed baseline.
      # Non-blocking on purpose (`|| true`) — intentional dynamic-boundary
      # additions must never fail CI; the report is for review, and enforcement
      # lives in AGENTS.md (## SmeltUnknown enforcement).
      #
      # This compared remeda's generated crate against the EXAMPLES baseline
      # until 2026-08-23, which is not a comparison: the examples corpus is 29
      # hand-written files with zero avoidable erasure, so every green run
      # printed a standing "avoidable erasure rose by 25435" against a crate it
      # had nothing to do with. A meaningless red line trains reviewers to
      # ignore the report, which is worse than having no report.
      - name: SmeltUnknown usage report (advisory)
        if: ${{ always() }}
        run: |
          if [ -d target/compat-repos/remeda/dist-smelt/src ]; then
            target/debug/smelt smelt-unknown-report \
              target/compat-repos/remeda/dist-smelt/src \
              --baseline blocker-logs/smelt-unknown-baseline-remeda.json || true
          else
            echo "No generated Remeda crate to scan; skipping SmeltUnknown report."
          fi

      # Blocking invariant: the checked-in example corpus must hold ZERO
      # avoidable erasure. AGENTS.md calls this a hard invariant, but nothing in
      # CI checked it until 2026-08-23 — it was enforced by policy alone. The
      # examples are small and hand-audited, so any avoidable erasure appearing
      # there is a real lowering regression with a readable reproduction, which
      # makes this the cheapest true signal in the whole SmeltUnknown suite.
      # Needs no compat checkout, only the smelt binary this job already built.
      - name: SmeltUnknown examples invariant (blocking, avoidable == 0)
        if: ${{ always() }}
        run: |
          target/debug/smelt smelt-unknown-report examples \
            --baseline blocker-logs/smelt-unknown-baseline.json \
            --fail-on-regression

  # Regression gate: transpile Radash at the ref pinned in
  # .github/compat/libraries.json, then compile and run all generated Rust
  # tests. Radash declares Jest-style test globals ambiently instead of
  # importing them; the explicit Vitest import added to the disposable clone
  # lets Smelt discover the same 84 tests without changing upstream sources.
  radash-regression:
    # Opt-in on PRs via the `run-regressions` label; always on for main pushes.
    # See the banner above `remeda-regression`.
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out Radash at the pinned ref + copy Smelt fixtures
        run: |
          ref="$(python3 -c "import json; libs=json.load(open('.github/compat/libraries.json'))['libraries']; print(next(l['ref'] for l in libs if l['name']=='radash'))")"
          echo "Radash ref: $ref"
          repo_dir="target/compat-repos/radash"
          rm -rf "$repo_dir"
          git clone --no-tags --filter=blob:none https://github.com/sodiray/radash.git "$repo_dir"
          git -C "$repo_dir" checkout "$ref"
          cp -R .github/compat/radash/. "$repo_dir"/

      - name: Expose ambient Radash tests to Smelt discovery
        run: |
          test_file="target/compat-repos/radash/src/tests/typed.test.ts"
          sed -i "/import { assert } from 'chai'/a import { describe, test } from 'vitest'" "$test_file"
          test "$(grep -Fc "import { describe, test } from 'vitest'" "$test_file")" -eq 1

      - name: Transpile Radash to Rust
        run: target/debug/smelt --manifest-path target/compat-repos/radash/Smelt.toml build

      - name: Compile and run generated Radash tests (regression gate)
        run: |
          RUSTFLAGS=-Awarnings cargo test \
            --manifest-path target/compat-repos/radash/dist-smelt/Cargo.toml \
            --no-fail-fast 2>&1 | tee radash-tests.log
          grep -F "test result: ok. 84 passed; 0 failed;" radash-tests.log

  # Regression gate: transpile es-toolkit at the ref pinned in
  # .github/compat/libraries.json with the smelt built from THIS commit, then
  # ratchet against checked-in high-water marks in
  # blocker-logs/es-toolkit-ci-baseline.json. Cloned from `remeda-regression`
  # but split into explicit gates because es-toolkit is still mid-campaign:
  #   G1 probe blockers <= baseline (scripts/check_estoolkit_gate.py),
  #   G2 `cargo check` errors == 0 (hard zero, cargo exit code),
  #   G3 `cargo test --no-run` errors == 0 (hard zero, cargo exit code),
  #   G4 runtime pass-count (advisory ratchet; hangs are known so non-blocking).
  # RUSTFLAGS=-Awarnings keeps the ~950 residual warnings from drowning the log
  # or gating; the warning count is tracked in the baseline as advisory only.
  es-toolkit-regression:
    # Opt-in on PRs via the `run-regressions` label; always on for main pushes.
    # See the banner above `remeda-regression`.
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out es-toolkit at the pinned ref + copy Smelt fixtures
        run: |
          # Single source of truth for the ref: .github/compat/libraries.json.
          # Do NOT rely on the third_party/es-toolkit gitlink (no .gitmodules
          # entry; a submodule checkout silently skips it).
          ref="$(python3 -c "import json; libs=json.load(open('.github/compat/libraries.json'))['libraries']; print(next(l['ref'] for l in libs if l['name']=='es-toolkit'))")"
          echo "es-toolkit ref: $ref"
          repo_dir="target/compat-repos/es-toolkit"
          rm -rf "$repo_dir"
          git clone --no-tags --filter=blob:none https://github.com/toss/es-toolkit.git "$repo_dir"
          git -C "$repo_dir" checkout "$ref"
          cp -R .github/compat/es-toolkit/. "$repo_dir"/

      # G1: probe how far es-toolkit transpiles and gate the blocker count.
      # `smelt probe` runs the whole-crate build itself, so dist-smelt exists
      # afterwards for the compile gates and rust-diagnostics below.
      - name: Probe es-toolkit (JSON report)
        run: |
          target/debug/smelt --manifest-path target/compat-repos/es-toolkit/Smelt.toml \
            probe --format json --output probe.json
          cat probe.json

      - name: Probe blocker gate (blockers <= baseline)
        run: |
          cargo_manifest="target/compat-repos/es-toolkit/dist-smelt/Cargo.toml"
          if ! python3 scripts/check_estoolkit_gate.py probe-gate \
              --baseline blocker-logs/es-toolkit-ci-baseline.json \
              --probe probe.json; then
            echo "Probe gate failed; grouping Rust diagnostics by family..."
            if [ -f "$cargo_manifest" ]; then
              target/debug/smelt rust-diagnostics \
                --cargo-manifest "$cargo_manifest" \
                --output gate-diagnostics.md || true
            fi
            # Re-run to fold the top diagnostic families into the step summary.
            python3 scripts/check_estoolkit_gate.py probe-gate \
              --baseline blocker-logs/es-toolkit-ci-baseline.json \
              --probe probe.json \
              --diagnostics gate-diagnostics.md || true
            exit 1
          fi

      # G2: the generated library crate must compile with zero errors. Hard
      # zero via cargo's exit code; warnings are silenced so they neither gate
      # nor bury the error output.
      - name: Generated library compiles (cargo check, errors == 0)
        run: |
          set -o pipefail
          RUSTFLAGS=-Awarnings cargo check --message-format short \
            --manifest-path target/compat-repos/es-toolkit/dist-smelt/Cargo.toml \
            2>&1 | tee /tmp/es-toolkit-libcheck.log

      # G3: the generated test suite must compile with zero errors. Hard zero
      # via cargo's exit code; wrapped in `timeout` as a belt-and-braces guard
      # against a pathological build hang.
      - name: Generated tests compile (cargo test --no-run, errors == 0)
        run: |
          set -o pipefail
          RUSTFLAGS=-Awarnings timeout 20m cargo test --no-run --message-format short \
            --manifest-path target/compat-repos/es-toolkit/dist-smelt/Cargo.toml \
            2>&1 | tee /tmp/es-toolkit-testcheck.log

      # G4: advisory runtime pass-count ratchet. The suite has known async
      # hangs (attemptAsync/combinations), so it runs under a hard wall-clock
      # kill and is deliberately non-blocking (`continue-on-error`); the gate
      # script only reports pass/fail vs baseline into the step summary.
      - name: Runtime ratchet (advisory)
        continue-on-error: true
        run: |
          set +e
          RUSTFLAGS=-Awarnings timeout --signal=KILL 20m \
            cargo test \
            --manifest-path target/compat-repos/es-toolkit/dist-smelt/Cargo.toml \
            --no-fail-fast -- --test-threads=4 2>&1 | tee runtime-tests.log
          status=${PIPESTATUS[0]}
          echo "cargo test exit status: $status"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::es-toolkit runtime suite hit the 20m wall-clock timeout (hang regression suspected)."
          fi
          python3 scripts/check_estoolkit_gate.py runtime-ratchet \
            --baseline blocker-logs/es-toolkit-ci-baseline.json \
            --log runtime-tests.log

      # SmeltUnknown ratchet: classify generated erasure and BLOCK on any rise in
      # avoidable erasure against the es-toolkit corpus baseline. Unlike the
      # advisory remeda report, this gates via `--fail-on-regression` (see
      # `## SmeltUnknown enforcement` in AGENTS.md): es-toolkit is the ratchet
      # corpus, so avoidable erasure may only stay equal or fall. Skips cleanly
      # when the generated crate is absent (build aborted mid-campaign) so it
      # never masks an earlier gate failure. Runs even after a prior failure so
      # the delta is visible in the log.
      - name: SmeltUnknown ratchet (blocking)
        if: ${{ always() }}
        run: |
          crate_src="target/compat-repos/es-toolkit/dist-smelt/src"
          baseline="blocker-logs/smelt-unknown-baseline-es-toolkit.json"
          if [ ! -d "$crate_src" ]; then
            echo "No generated es-toolkit crate to scan; skipping SmeltUnknown ratchet."
          elif [ ! -f "$baseline" ]; then
            echo "No es-toolkit SmeltUnknown baseline at $baseline; skipping ratchet."
          else
            target/debug/smelt smelt-unknown-report "$crate_src" \
              --baseline "$baseline" \
              --fail-on-regression
          fi

      # The compile gates above print their errors where they run, but the
      # SmeltUnknown ratchet that follows emits thousands of lines and pushes
      # them past any tail the Actions log API will return, which makes the
      # failures effectively unreadable without downloading artifacts. This
      # re-prints a grouped summary as the LAST thing in the job so the error
      # classes are always reachable from the log tail.
      - name: Compile error summary (readable tail)
        if: ${{ always() }}
        run: |
          for log in /tmp/es-toolkit-libcheck.log /tmp/es-toolkit-testcheck.log; do
            [ -f "$log" ] || continue
            echo "::group::$(basename "$log")"
            # `--message-format short` prints `path:line:col: error[E0308]: ...`,
            # so the diagnostic is NOT at the start of the line — do not anchor.
            total=$(grep -cE 'error(\[E[0-9]{4}\])?:' "$log" || true)
            echo "total error lines: $total"
            echo "--- error classes (count, code) ---"
            grep -oE 'error\[E[0-9]{4}\]' "$log" | sort | uniq -c | sort -rn | head -25 || true
            echo "--- error lines (up to 60, full text) ---"
            grep -E 'error(\[E[0-9]{4}\])?:' "$log" | head -60 || true
            echo "::endgroup::"
          done

      - name: Upload es-toolkit probe + gate artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: es-toolkit-probe
          path: |
            probe.json
            gate-diagnostics.md
            runtime-tests.log
            /tmp/es-toolkit-libcheck.log
            /tmp/es-toolkit-testcheck.log
          if-no-files-found: ignore
