name: CI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    # Documentation-only changes cannot affect any gate in this workflow, so
    # skip the whole Rust matrix (~20 min of runner time) for them. Everything
    # a gate reads is deliberately absent from this list: crates/**,
    # Cargo.{toml,lock}, .github/**, scripts/**, third_party/**, and the
    # blocker-logs/*.json baselines (es-toolkit ratchet + SmeltUnknown).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '*.svg'
      - 'coverage-summary.json'
  pull_request:
    # `main` is the merge target that matters, but a *stacked* PR (one whose base
    # is the branch below it in a chain) would otherwise get no CI at all: a
    # `pull_request` trigger only fires for the base branches named here. A
    # stacked PR with zero checks is unreviewable, so `claude/**` is included as
    # a base too. Those runs test the stacked head against its parent branch,
    # which is exactly the diff under review; the same jobs re-run against `main`
    # once the chain is flattened and the PR is retargeted.
    branches: [ main, 'claude/**' ]
    # `labeled` is required so that applying the `run-regressions` label starts a
    # run; `synchronize` keeps the regression jobs re-running on every later push
    # while the label is still applied. Naming `types` at all means the three
    # defaults must be respelled — omitting the key implies
    # [opened, synchronize, reopened].
    types: [ opened, synchronize, reopened, labeled ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '*.svg'
      - 'coverage-summary.json'

# Supersede in-flight runs for the same branch. Restricted to pull requests on
# purpose: cancelling a `main` push run would skip the es-toolkit regression
# gate and the coverage-report commit for that commit, so main pushes always
# run to completion even when several land back to back.
#
# `labeled` events are excluded from cancellation. Without that exclusion,
# applying ANY label to a PR would land in this group and cancel a legitimate
# in-flight run for the same ref — and because the label run deliberately skips
# test/corpus/clippy (see their `if:`), the PR would be left with no result
# for those checks at all until the next push. A label event may therefore never
# cancel anything; a subsequent push still cancels the label run, which is
# correct because that run tested older code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

jobs:
  # The gate scripts and the rules they hold each other to: seconds of Python,
  # and the one job that notices another gate being switched off.
  ci-gates:
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Gate script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Workflows and test helpers keep their gates
        run: python3 scripts/check_ci_gates.py

  # Lint gate. The lint policy itself lives in the repo, not here:
  # `[workspace.lints.rust]` / `[workspace.lints.clippy]` in Cargo.toml set
  # clippy::{all,pedantic,nursery} to "deny" plus a large hand-picked restriction
  # set, `crates/smelt-runtime/Cargo.toml` demotes the style groups for text that
  # is emitted verbatim, and clippy.toml tightens the thresholds. This job runs
  # that policy over every target of every workspace member.
  #
  # Deny-level lints fail through cargo's exit code. Warn-level lints are a
  # ratchet: a count per crate and lint in blocker-logs/clippy-baseline.json that
  # may only fall. See scripts/check_clippy_ratchet.py for why `-D warnings` is
  # not the form of this gate.
  #
  # Cache: restores the plain "build" lane but never saves it (`save-if: false`).
  # `cargo clippy` compiles *dependencies* with real rustc — only workspace
  # crates go through clippy-driver — so restoring the lane gives this job warm
  # third-party artifacts for free. Saving would be actively harmful: whichever
  # job wins the race writes the shared lane, and a clippy-driver-fingerprinted
  # target dir would force the corpus/regression jobs to recompile.
  clippy:
    # Skip on `labeled`: that event exists only to let a maintainer opt a PR into
    # the regression jobs below, and re-running this lint (plus coverage and
    # corpus) for every unrelated label added to any PR is pure waste. On `push`
    # there is no `action`, so the expression is true and the job runs.
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml carries the components: the toolchain the workspace
      # builds with is the one that has to have clippy.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build
          save-if: false

      - name: Clippy (deny-level fails, warn-level may only fall)
        run: |
          set +e
          cargo clippy --workspace --all-targets --keep-going --message-format=json > clippy.json
          status=$?
          set -e
          python3 scripts/check_clippy_ratchet.py \
            --baseline blocker-logs/clippy-baseline.json \
            --messages clippy.json --cargo-status "$status"

  # Packaging dry run: every publishable crate packages in the derived order, and
  # the set of crates that cannot be published has not moved. Publishes nothing.
  package:
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build
          save-if: false

      - name: Package every publishable crate
        run: scripts/publish-crates.sh

  # Slow tier: compile the emitted-Rust corpus. This is a plain (non-instrumented)
  # build on the pinned toolchain, so it runs as its own job in parallel with coverage and shares
  # the "build" cache lane with the other plain-build workflows. It does not need the
  # nightly toolchain, cargo-llvm-cov, or the GUI native libs (it only builds
  # smelt-codegen-rust and its dependencies, not smelt-gui).
  corpus:
    # See the note on `clippy`: never re-run just because a label was added.
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      # One step, both tiers: the harness runs the two `#[ignore]`d tests in
      # parallel and they share the emitted-crate dependency build, so a single
      # invocation is ~158s where two sequential steps are ~213s (inline corpus
      # 63s + rescued callback-generics fixtures 150s, each paying for its own
      # scratch target dir). Failures are attributed by test name in the output.
      - name: Compile emitted-Rust corpus + rescued fixtures (slow tier)
        run: |
          cargo test -p smelt-codegen-rust --test compile_corpus -- --ignored

      # The *generated* callback-generics shape grid, fast tier only: a greedy
      # pairwise covering subset (75 of the 467 legal shapes) in which every
      # pair of axis values that occurs anywhere in the grid occurs at least
      # once. ~95s. The whole grid is ~10 min and runs nightly instead, in
      # .github/workflows/shape-grid.yml — a slow tier on every PR is a tier
      # that gets disabled.
      #
      # Separate step because it is a separate test binary; it reuses this
      # job's warm workspace build, and only the emitted crates' shared
      # dependency build is paid again.
      - name: Callback-generics shape grid (fast pairwise tier)
        run: |
          cargo test -p smelt-codegen-rust --test shape_grid -- --ignored shape_grid_fast

      # The container-semantics runtime tiers: these lower a TypeScript fixture
      # to a crate and RUN it, so a green result means every generated
      # `expect(...)` held at runtime. They exist because `SmeltJsSet` and
      # `SmeltJsMap` find members/keys through a hash index rather than a scan,
      # and the ways the index and the insertion-ordered backing `Vec` can
      # disagree — a stale slot after a delete, `NaN`, `+0`/`-0`, object identity,
      # a write through an alias — all type-check fine and are invisible to the
      # corpus tier above. Both binaries in one step so they share the emitted
      # crates' dependency build. ~90s.
      - name: Set/Map container semantics (runtime tier)
        run: |
          cargo test -p smelt-codegen-rust --test set_membership_runtime -- --ignored
          cargo test -p smelt-codegen-rust --test map_lookup_runtime -- --ignored

      # The two gates below run on every PR, not only labelled ones: they need
      # just the smelt binary and hold invariants a label must not be able to
      # skip. `always()` keeps them running when a tier above failed.
      - name: Build smelt
        if: ${{ always() }}
        run: cargo build --bin smelt

      # Blocking invariant: the checked-in example corpus must hold ZERO
      # avoidable erasure. AGENTS.md calls this a hard invariant, but nothing in
      # CI checked it until 2026-08-23 — it was enforced by policy alone. The
      # examples are small and hand-audited, so any avoidable erasure appearing
      # there is a real lowering regression with a readable reproduction, which
      # makes this the cheapest true signal in the whole SmeltUnknown suite.
      # Needs no compat checkout, only the smelt binary this job already built.
      - name: SmeltUnknown examples invariant (blocking, avoidable == 0)
        if: ${{ always() }}
        run: |
          target/debug/smelt smelt-unknown-report examples \
            --baseline blocker-logs/smelt-unknown-baseline.json \
            --fail-on-regression

      # A change to the manifest types has to carry the regenerated schema.
      - name: smelt-schema.json matches `dump-schema`
        run: target/debug/smelt dump-schema | diff - smelt-schema.json

      # Blocking typedness ratchet over the end-to-end examples: each
      # `input.ts` is lowered in-process (no Rust build) and may never become
      # less typed than its record in the baseline (an erased count up for values,
      # reads or calls; the typed share is reported, not judged). See `## Typedness ratchet`.
      - name: Typedness examples ratchet (blocking)
        if: ${{ always() }}
        run: |
          target/debug/smelt typedness-report examples/typescript/end-to-end/*/input.ts \
            --baseline blocker-logs/typedness-baseline.json \
            --fail-on-regression

  # Sandbox gate: proves the fail-closed specialization boundary actually
  # executes, rather than skipping itself into a green result.
  #
  # The sandbox-backed tests skip when `bwrap`, `prlimit`, or a guest runtime is
  # missing, because developer machines rarely have them. That skip used to be
  # spelled `return Ok(())`, which is indistinguishable from a pass — so every
  # one of these tests reported success in CI while never launching a guest
  # process. See gap 3 of blocker-logs/test-coverage-analysis.md.
  #
  # `SMELT_REQUIRE_SANDBOX=1` turns a missing prerequisite into a failure, in
  # this job and in every other job that runs tool-backed tests (`test`,
  # `coverage`). It is a separate job on purpose: a runner-side sandbox regression
  # should surface as one clearly-named failure, on every push and pull request.
  sandbox:
    # See the note on `clippy`: never re-run just because a label was added.
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      - name: Install test tools
        uses: ./.github/actions/setup-test-tools

      # Fails the job early with a readable message if the runner cannot create
      # the namespaces bubblewrap needs, instead of leaving that to a Rust test.
      #
      # This binds all of `/` read-only on purpose. It is a smoke test of
      # "can bwrap unshare and exec a guest here", NOT the production sandbox
      # posture — the real policy comes from `SandboxPolicyRecord` and binds
      # only its own read-only roots. Enumerating those roots by hand here is
      # what broke the first attempt: binding /usr, /bin, and /lib but not
      # /lib64 left the dynamic loader missing, and exec fails with a bare
      # "No such file or directory" that points at the wrong thing entirely.
      - name: Verify the hard sandbox can start a guest
        run: |
          bwrap --die-with-parent --new-session --unshare-all --cap-drop ALL \
                --clearenv --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
                /bin/echo "hard sandbox is functional"

      - name: Specialization tests (skipping forbidden)
        env:
          SMELT_REQUIRE_SANDBOX: "1"
        run: |
          cargo test -p smelt-specialize
          cargo test -p smelt-codegen-rust \
            --test python_specialization_parity \
            --test typescript_specialization_parity

  # PR test gate: runs only the tests a change can affect, on the pinned
  # toolchain with a warm cache. The instrumented nightly run below (`coverage`) is main-only.
  #
  # Selection is per workspace package (scripts/ci_affected_packages.py): the
  # packages that own a changed file plus every package that depends on them,
  # `--workspace` for anything the script does not recognise (root manifests,
  # Cargo.lock, this workflow, unknown paths), and nothing for paths no
  # `cargo test` reads (third_party/, blocker-logs/, ...). A change to the
  # frontend, MIR or emitter still reaches `smelt-transpiler`, whose end-to-end
  # corpus is the bulk of the suite, so those PRs run nearly everything; the
  # selection mainly spares leaf-only PRs (runtime, python, ts-types, test
  # harness) the transpiler corpus.
  #
  # The diff is taken against the merge commit's first parent (`HEAD^1`), which
  # is exactly the PR's change on top of its current base.
  test:
    # See the note on `clippy`: never re-run just because a label was added.
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    env:
      # Line tables keep panic backtraces readable; full debuginfo for ~150
      # test binaries plus the generated crates' builds filled the runner's
      # disk (ENOSPC on the first run of this job). Also shrinks the cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Select affected packages
        id: affected
        run: |
          git diff --name-only HEAD^1 HEAD | python3 scripts/ci_affected_packages.py -

      # Own lane, not `build`: the corpus/sandbox jobs save `build` with only
      # the subset of the workspace they compile, and whichever job finishes
      # first wins the save.
      - name: Set up Rust
        if: ${{ steps.affected.outputs.mode != 'none' }}
        uses: ./.github/actions/setup-rust
        with:
          shared-key: test

      - name: Install test tools
        if: ${{ steps.affected.outputs.mode != 'none' }}
        uses: ./.github/actions/setup-test-tools

      # The workspace test build needs the room.
      - name: Free runner disk
        if: ${{ steps.affected.outputs.mode != 'none' }}
        uses: ./.github/actions/free-disk

      # Build and run are separate steps so the log says which one is slow,
      # and `df` after each shows which one is eating the disk.
      - name: Build affected tests
        if: ${{ steps.affected.outputs.mode != 'none' }}
        run: |
          cargo test --no-run ${{ steps.affected.outputs.args }}
          df -h / | tail -1

      - name: Test affected packages
        if: ${{ steps.affected.outputs.mode != 'none' }}
        env:
          SMELT_REQUIRE_SANDBOX: "1"
        run: |
          cargo test ${{ steps.affected.outputs.args }}
          df -h / | tail -1

  coverage:
    # Main-only: the instrumented nightly build cannot use a cache (see below)
    # and only main's run publishes the badge and README tables, so pull
    # requests are gated by the `test` job above instead.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nightly Rust (for branch coverage)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      # No native GUI libraries are installed here on purpose: smelt-gui is
      # excluded from the workspace (see `exclude` in the root Cargo.toml), so
      # `--workspace` can never reach gpui and the xcb/xkbcommon dev packages
      # are never linked. Re-add them only if smelt-gui rejoins the workspace.

      # DELIBERATELY NO `Swatinem/rust-cache` STEP HERE. Please do not re-add one.
      #
      # This job builds through `cargo +nightly`, and `dtolnay/rust-toolchain@nightly`
      # above is unpinned, so it resolves a new nightly roughly every day.
      # rust-cache hashes the resolved rustc version into its cache key, so the
      # key rotated daily while the cached artifacts were also invalidated daily
      # by the very same rustc change. The lane could therefore never hit.
      #
      # Measured on run 30451649094 (and confirmed identical on the PR run
      # 30451166101): the restore reported success, then cargo recompiled all
      # 324 units from `unicode-ident` upward — a fully cold instrumented build
      # in both cases. The lane cost ~10 s to restore + ~11-13 s to save and
      # returned nothing, while occupying ~664 MB of the repo cache budget per
      # ref. `cache-bin: true` was inert too: `taiki-e/install-action` fetches a
      # prebuilt cargo-llvm-cov musl binary in ~0.4 s.
      #
      # Re-adding a cache here only pays off together with a *pinned* nightly
      # (e.g. `nightly-YYYY-MM-DD`), which was considered and rejected to avoid
      # the recurring manual toolchain bump.

      - name: Install coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Without these the sandbox-backed specialization tests cannot run, and
      # `smelt-specialize` would report ~50% line / ~36% branch coverage for code
      # that never ran.
      - name: Install test tools
        uses: ./.github/actions/setup-test-tools

      - name: Test with coverage
        env:
          SMELT_REQUIRE_SANDBOX: "1"
        run: |
          cargo +nightly llvm-cov --workspace --branch --lcov --output-path lcov.info

      - name: Coverage summary (JSON)
        run: |
          cargo +nightly llvm-cov report --branch --json --summary-only --output-path coverage-summary.json

      - name: Generate badge
        run: |
          bash scripts/coverage_badge.sh lcov.info coverage.svg coverage-summary.json

      - name: Update README coverage tables
        run: |
          python3 scripts/update_readme_coverage.py coverage-summary.json README.md lcov.info

      - name: Commit coverage updates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md coverage-summary.json coverage.svg coverage-functions.svg coverage-lines.svg coverage-regions.svg coverage-branches.svg
          git diff --quiet --cached && echo "No coverage updates to commit." || git commit -m "chore(ci): update coverage report"

      # This job runs for many minutes, so main can move underneath it; replay
      # the coverage commit on the current tip, as library-probes.yml does.
      - name: Push coverage updates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.svg
            coverage-summary.json
            coverage-functions.svg
            coverage-lines.svg
            coverage-regions.svg
            coverage-branches.svg

  # NOTE: the `publish-smelt` job that used to live here has moved to its own
  # dispatch-only workflow, .github/workflows/publish-smelt.yml. It cost ~5.5 min
  # of runner time on every push to main while its only consumers are a daily
  # cron (library-probes) and a manual dispatch (compat), so it is now published
  # on demand. Consumers verify the asset's source commit and fall back to a
  # from-source build on mismatch, so an out-of-date asset can never be used
  # silently.

  # Regression gate: transpile the Remeda library at the ref pinned in
  # .github/compat/libraries.json with the smelt
  # built from THIS commit, then compile and run its generated Rust test suite.
  # The corpus currently has 1789 tests, all passing; this job fails if a codegen,
  # frontend, or MIR change regresses any of them. Builds smelt from source (not
  # the smelt-nightly asset) so pull requests are gated against their own code.
  # ==========================================================================
  # OPT-IN ON PULL REQUESTS — READ THIS BEFORE MERGING A CODEGEN CHANGE
  #
  # The four library regression gates below (remeda / radash / es-toolkit / hono) do
  # NOT run on a pull request unless the PR carries the `run-regressions` label.
  # They DO run unconditionally on every push to main.
  #
  # If your PR touches the frontend, HIR, MIR, specializer, or the Rust emitter,
  # add the `run-regressions` label and wait for them. A green PR without that
  # label has NOT been checked against Remeda (1789 tests), Radash (387 tests),
  # Hono or the es-toolkit ratchet, and main is not branch-protected, so nothing else
  # will stop a regression from landing.
  #
  # Once applied, the label sticks: every later push to the PR re-runs them.
  # Rationale: ~7 min of runner time per PR run for four jobs that sit well
  # inside the test/coverage critical path, so skipping them saves runner minutes on
  # docs/CI-only PRs without making anyone wait longer.
  # ==========================================================================
  remeda-regression:
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out Remeda
        uses: ./.github/actions/checkout-library
        with:
          name: remeda

      # Remeda's types import `type-fest` (a type-only dependency): without it
      # every such import is unresolved and its uses cascade into ~280
      # checker errors. With the lockfile's dependencies installed the
      # checker sees what the library's own `tsc` sees and Remeda type-checks,
      # so the build runs under the default type gate.
      - name: Install Remeda's locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: target/compat-repos/remeda

      - name: Transpile Remeda to Rust
        run: target/debug/smelt --manifest-path target/compat-repos/remeda/Smelt.toml build

      - name: Compile and run generated Remeda tests (regression gate)
        # 1788 of 1789 pass; `isObjectType` fails its inline snapshot because an
        # erased `Set<string>` is a bare array (blocker-logs/radash-real-assertion-failures.md).
        # Earlier runs of all 1789: The four `randomBigInt` tests that used to fail
        # needed a real bigint: a literal wider than i64
        # (`9_999_999_999_999_999_999_999n`) and an accumulator past 2^63, which
        # `num_bigint::BigInt` now carries exactly
        # (blocker-logs/globals-suite-failures.md section C). The pin fails on
        # any failure and on a change to the total.
        run: |
          cargo test --manifest-path target/compat-repos/remeda/dist-smelt/Cargo.toml \
            --no-fail-fast 2>&1 | tee remeda-tests.log || true
          grep -F "test result: FAILED. 1788 passed; 1 failed;" remeda-tests.log

      # Advisory SmeltUnknown metric: classify generated erasure and surface any
      # rise in avoidable erasure against remeda's OWN committed baseline.
      # Non-blocking on purpose (`|| true`) — intentional dynamic-boundary
      # additions must never fail CI; the report is for review, and enforcement
      # lives in AGENTS.md (## SmeltUnknown enforcement).
      #
      # This compared remeda's generated crate against the EXAMPLES baseline
      # until 2026-08-23, which is not a comparison: the examples corpus is 29
      # hand-written files with zero avoidable erasure, so every green run
      # printed a standing "avoidable erasure rose by 25435" against a crate it
      # had nothing to do with. A meaningless red line trains reviewers to
      # ignore the report, which is worse than having no report.
      - name: SmeltUnknown usage report (advisory)
        if: ${{ always() }}
        run: |
          test -f blocker-logs/smelt-unknown-baseline-remeda.json
          if [ -d target/compat-repos/remeda/dist-smelt/src ]; then
            target/debug/smelt smelt-unknown-report \
              target/compat-repos/remeda/dist-smelt/src \
              --baseline blocker-logs/smelt-unknown-baseline-remeda.json || true
          else
            echo "No generated Remeda crate to scan; skipping SmeltUnknown report."
          fi

      # Advisory typedness ratchet (Bun `--aot` typedness tests, oven-sh/bun#45631):
      # how many values, property reads and calls of each remeda file reach Rust
      # concrete, generic or erased, read from the `smelt-typedness.json` sidecar
      # the build wrote. Non-blocking, like remeda's SmeltUnknown report; see
      # `## Typedness ratchet` in AGENTS.md.
      - name: Typedness report (advisory)
        if: ${{ always() }}
        run: |
          test -f blocker-logs/typedness-baseline-remeda.json
          if [ -f target/compat-repos/remeda/dist-smelt/smelt-typedness.json ]; then
            target/debug/smelt typedness-report \
              target/compat-repos/remeda/dist-smelt \
              --baseline blocker-logs/typedness-baseline-remeda.json || true
          else
            echo "No remeda typedness sidecar; skipping typedness report."
          fi

  # Regression gate: transpile Radash at the ref pinned in
  # .github/compat/libraries.json, then compile and run all generated Rust
  # tests. Radash declares Jest-style test globals ambiently instead of
  # importing them; the explicit Vitest import added to the disposable clone
  # keeps `typed.test.ts` discoverable without changing upstream sources, and
  # the globals-as-test-modules rule makes every other suite real: 387 tests
  # (84 before that rule). Four still fail on shapes Smelt does not model yet
  # (`as any` type-violating inputs x2, `Proxy` traps x1, and `omit function
  # handles null keys`, which passes `null as unknown as []` where a tuple is
  # declared) -- see blocker-logs/globals-suite-failures.md -- so the assertion
  # below pins exactly those four failures until they land. The fourth passed
  # only vacuously until the multi-line `export {..} from` dependency fix: `_.omit`
  # had resolved to `undefined`, so the call did nothing. Type-violating test
  # inputs stay unsupported.
  radash-regression:
    # Opt-in on PRs via the `run-regressions` label; always on for main pushes.
    # See the banner above `remeda-regression`.
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out Radash
        uses: ./.github/actions/checkout-library
        with:
          name: radash

      - name: Expose ambient Radash tests to Smelt discovery
        run: |
          test_file="target/compat-repos/radash/src/tests/typed.test.ts"
          sed -i "/import { assert } from 'chai'/a import { describe, test } from 'vitest'" "$test_file"
          test "$(grep -Fc "import { describe, test } from 'vitest'" "$test_file")" -eq 1

      # The opt-out is for one genuine type error in Radash itself:
      # `src/async.ts:313` (TS2322, a `Promise<any>` returned where the
      # conditional return type is expected; `tsc` 5.9.3 and TypeScript 7
      # report it too). The tests' `chai` import, not installed here, is an
      # untyped module to the checker (as to lowering) and adds no error.
      - name: Transpile Radash to Rust
        run: target/debug/smelt --manifest-path target/compat-repos/radash/Smelt.toml build --allow-type-errors

      - name: Compile and run generated Radash tests (regression gate)
        run: |
          RUSTFLAGS=-Awarnings cargo test \
            --manifest-path target/compat-repos/radash/dist-smelt/Cargo.toml \
            --no-fail-fast 2>&1 | tee radash-tests.log || true
          # Pinned-failure ratchet: rises as the failures real assertions exposed are
          # fixed. The pin fails on any other failure or a changed total.
          grep -F "test result: FAILED. 360 passed; 27 failed;" radash-tests.log

  # Regression gate for the Hono campaign (blocker-logs/hono-campaign-plan.md).
  #
  # Hono is pure TypeScript with zero runtime dependencies, so it is the corpus
  # that shows whether Smelt can transpile a FRAMEWORK — routers, middleware
  # composition, a context object, cookies, validators — rather than only
  # utilities. Phase 2 landed the whole non-test crate at 0 `cargo check`
  # errors and linking (`blocker-logs/hono-current.md`), so `smelt build` +
  # `cargo check` on `dist-smelt` are now a HARD gate, mirroring the radash job
  # above. Phase 3 (bringing Hono's own `*.test.ts` files into scope) is in
  # progress: the generated test target does not build yet, and the exact count
  # of its rustc errors is pinned in blocker-logs/hono-ci-baseline.json. At zero
  # the tests run, and their results get pinned there.
  # A build-only check: ts-pattern is not pinned to a test count, so nothing else
  # would notice lowering refusing it. Its generated crate does not compile yet,
  # so the gate stops at `smelt build`; about 100 s of lowering at 2.5 GB.
  ts-pattern-build:
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out ts-pattern
        uses: ./.github/actions/checkout-library
        with:
          name: ts-pattern

      # The opt-out is for one type error TypeScript 7 reports in ts-pattern's
      # own tests: `tests/distribute-unions.test.ts:240` (TS2344, a type-level
      # `Expect<Equal<...>>` that is `false`); `tsgo` 7.0 reports it, `tsc`
      # 5.9 does not, and Smelt checks with TypeScript 7's checker.
      - name: Transpile ts-pattern (a refused corpus fails here)
        run: target/debug/smelt --manifest-path target/compat-repos/ts-pattern/Smelt.toml build --allow-type-errors

  # A build-only check, as for ts-pattern: date-fns is not pinned to a test count,
  # so nothing else would notice lowering refusing it (a `while` over a call once
  # stopped it, unseen). Its generated crate does not compile yet, so the gate
  # stops at `smelt build`.
  date-fns-build:
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out date-fns
        uses: ./.github/actions/checkout-library
        with:
          name: date-fns

      - name: Transpile date-fns (a refused corpus fails here)
        run: target/debug/smelt --manifest-path target/compat-repos/date-fns/Smelt.toml build

  hono:
    # Opt-in on PRs via the `run-regressions` label; always on for main pushes.
    # See the banner above `remeda-regression`.
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out Hono
        uses: ./.github/actions/checkout-library
        with:
          name: hono

      - name: Report Hono source-lowering blockers (advisory)
        run: |
          target/debug/smelt --manifest-path target/compat-repos/hono/Smelt.toml \
            probe --format md | tee hono-probe.md
          echo "--- per-file blockers ---"
          target/debug/smelt --manifest-path target/compat-repos/hono/Smelt.toml \
            check --message-format json | tee hono-blockers.json
          python3 -c "
          import json
          rows = json.load(open('hono-blockers.json'))
          blockers = [row for row in rows if row['category'] != 'type-check']
          print(f'hono blockers: {len(blockers)}; checker diagnostics: {len(rows) - len(blockers)}')
          "

      - name: Transpile Hono to Rust + compile the generated crate (regression gate)
        # HARD: the non-test Hono crate is at 0 cargo check errors and links
        # (blocker-logs/hono-current.md), same bar as radash/remeda.
        run: |
          target/debug/smelt --manifest-path target/compat-repos/hono/Smelt.toml build
          cargo check --manifest-path target/compat-repos/hono/dist-smelt/Cargo.toml

      - name: Generated Hono test build (pinned error count)
        # The time limit keeps a slow test build (the test crate is ~90 MB of
        # generated Rust) from holding the job for hours.
        timeout-minutes: 45
        run: |
          set +e
          cargo test --manifest-path target/compat-repos/hono/dist-smelt/Cargo.toml \
            --no-fail-fast 2>&1 | tee hono-tests.log
          echo "cargo test exit status: ${PIPESTATUS[0]}"
          set -e
          python3 scripts/check_library_gate.py compile-pin \
            --baseline blocker-logs/hono-ci-baseline.json \
            --log hono-tests.log
          python3 scripts/check_library_gate.py runtime-ratchet \
            --baseline blocker-logs/hono-ci-baseline.json \
            --log hono-tests.log

      # Advisory SmeltUnknown metric, remeda-style: a regression never blocks,
      # but a missing blocker-logs/smelt-unknown-baseline-hono.json does, because
      # the report would then compare against nothing.
      - name: SmeltUnknown usage report (advisory)
        if: ${{ always() }}
        run: |
          test -f blocker-logs/smelt-unknown-baseline-hono.json
          if [ -d target/compat-repos/hono/dist-smelt/src ]; then
            target/debug/smelt smelt-unknown-report \
              target/compat-repos/hono/dist-smelt/src \
              --baseline blocker-logs/smelt-unknown-baseline-hono.json || true
          else
            echo "No generated Hono crate to scan; skipping SmeltUnknown report."
          fi

  # Regression gate: transpile es-toolkit at the ref pinned in
  # .github/compat/libraries.json with the smelt built from THIS commit, then
  # ratchet against checked-in high-water marks in
  # blocker-logs/es-toolkit-ci-baseline.json. Cloned from `remeda-regression`
  # but split into explicit gates because es-toolkit is still mid-campaign:
  #   G1 probe blockers <= baseline (scripts/check_library_gate.py),
  #   G2 `cargo check` errors == 0 (hard zero, cargo exit code),
  #   G3 `cargo test --no-run` errors == 0 (hard zero, cargo exit code),
  #   G4 runtime: no failure outside the pinned set, passes >= the pinned floor.
  # RUSTFLAGS=-Awarnings keeps the ~950 residual warnings from drowning the log
  # or gating; the warning count is tracked in the baseline as advisory only.
  es-toolkit-regression:
    # Opt-in on PRs via the `run-regressions` label; always on for main pushes.
    # See the banner above `remeda-regression`.
    if: >-
      ${{ github.event_name == 'push'
          || contains(github.event.pull_request.labels.*.name, 'run-regressions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: build

      - name: Build smelt
        run: cargo build --bin smelt

      - name: Check out es-toolkit
        uses: ./.github/actions/checkout-library
        with:
          name: es-toolkit

      # G1: probe how far es-toolkit transpiles and gate the blocker count.
      # `smelt probe` runs the whole-crate build itself, so dist-smelt exists
      # afterwards for the compile gates and rust-diagnostics below.
      # The opt-out is for one type error TypeScript 7 reports in es-toolkit's
      # tests: `src/function/partial.spec.ts:104` (TS2554, overload
      # resolution of `partial(curried, placeholder, ...)`; `tsgo` 7.0 reports
      # it, `tsc` 5.9 does not). The `fast-check` dev dependency, not
      # installed here, is an untyped module to the checker and adds none.
      - name: Probe es-toolkit (JSON report)
        run: |
          target/debug/smelt --manifest-path target/compat-repos/es-toolkit/Smelt.toml \
            probe --allow-type-errors --format json --output probe.json
          cat probe.json

      - name: Probe blocker gate (blockers <= baseline)
        run: |
          cargo_manifest="target/compat-repos/es-toolkit/dist-smelt/Cargo.toml"
          if ! python3 scripts/check_library_gate.py probe-gate \
              --baseline blocker-logs/es-toolkit-ci-baseline.json \
              --probe probe.json; then
            echo "Probe gate failed; grouping Rust diagnostics by family..."
            if [ -f "$cargo_manifest" ]; then
              target/debug/smelt rust-diagnostics \
                --cargo-manifest "$cargo_manifest" \
                --output gate-diagnostics.md || true
            fi
            # Re-run to fold the top diagnostic families into the step summary.
            python3 scripts/check_library_gate.py probe-gate \
              --baseline blocker-logs/es-toolkit-ci-baseline.json \
              --probe probe.json \
              --diagnostics gate-diagnostics.md || true
            exit 1
          fi

      # G2: the generated library crate must compile with zero errors. Hard
      # zero via cargo's exit code; warnings are silenced so they neither gate
      # nor bury the error output.
      - name: Generated library compiles (cargo check, errors == 0)
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never RUSTFLAGS=-Awarnings cargo check --message-format short \
            --manifest-path target/compat-repos/es-toolkit/dist-smelt/Cargo.toml \
            2>&1 | tee /tmp/es-toolkit-libcheck.log

      # G3: the generated test suite must compile with zero errors. Hard zero
      # via cargo's exit code; wrapped in `timeout` as a belt-and-braces guard
      # against a pathological build hang.
      - name: Generated tests compile (cargo test --no-run, errors == 0)
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never RUSTFLAGS=-Awarnings timeout 20m cargo test --no-run --message-format short \
            --manifest-path target/compat-repos/es-toolkit/dist-smelt/Cargo.toml \
            2>&1 | tee /tmp/es-toolkit-testcheck.log

      # G4: blocking runtime ratchet. A hard wall-clock kill bounds a hang; a
      # killed suite prints no complete summary, so it fails on its count.
      - name: Runtime ratchet (blocking)
        run: |
          set +e
          RUSTFLAGS=-Awarnings timeout --signal=KILL 20m \
            cargo test \
            --manifest-path target/compat-repos/es-toolkit/dist-smelt/Cargo.toml \
            --no-fail-fast -- --test-threads=4 2>&1 | tee runtime-tests.log
          status=${PIPESTATUS[0]}
          echo "cargo test exit status: $status"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::es-toolkit runtime suite hit the 20m wall-clock timeout (hang regression suspected)."
          fi
          python3 scripts/check_library_gate.py runtime-ratchet \
            --baseline blocker-logs/es-toolkit-ci-baseline.json \
            --log runtime-tests.log

      # SmeltUnknown ratchet: classify generated erasure and BLOCK on any rise in
      # avoidable erasure against the es-toolkit corpus baseline. Unlike the
      # advisory remeda report, this gates via `--fail-on-regression` (see
      # `## SmeltUnknown enforcement` in AGENTS.md): es-toolkit is the ratchet
      # corpus, so avoidable erasure may only stay equal or fall. Runs even after
      # a prior failure so the delta is visible in the log. An absent crate fails
      # here too: the report refuses a scan of no file.
      - name: SmeltUnknown ratchet (blocking)
        if: ${{ always() }}
        run: |
          target/debug/smelt smelt-unknown-report target/compat-repos/es-toolkit/dist-smelt/src \
            --baseline blocker-logs/smelt-unknown-baseline-es-toolkit.json \
            --fail-on-regression

      # Typedness ratchet (blocking): no es-toolkit file may become less typed
      # than its record in the baseline. Reads the sidecar the build wrote next
      # to the generated `src/`; a missing sidecar is a failure, not a skip.
      - name: Typedness ratchet (blocking)
        if: ${{ always() }}
        run: |
          target/debug/smelt typedness-report target/compat-repos/es-toolkit/dist-smelt \
            --baseline blocker-logs/typedness-baseline-es-toolkit.json \
            --fail-on-regression

      # The compile gates above print their errors where they run, but the
      # SmeltUnknown ratchet that follows emits thousands of lines and pushes
      # them past any tail the Actions log API will return, which makes the
      # failures effectively unreadable without downloading artifacts. This
      # re-prints a grouped summary as the LAST thing in the job so the error
      # classes are always reachable from the log tail.
      - name: Compile error summary (readable tail)
        if: ${{ always() }}
        run: |
          for log in /tmp/es-toolkit-libcheck.log /tmp/es-toolkit-testcheck.log; do
            [ -f "$log" ] || continue
            echo "::group::$(basename "$log")"
            # The job sets CARGO_TERM_COLOR=always, so a captured log can carry
            # ANSI escapes *between* the code and its colon — `error[E0308]`
            # matches as a substring while `error[E0308]:` does not, which is why
            # an earlier version of this step counted 0 while still finding the
            # codes. Strip the escapes before matching anything.
            plain=$(mktemp)
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$log" > "$plain"
            # `--message-format short` prints `path:line:col: error[E0308]: ...`,
            # so the diagnostic is NOT at the start of the line — do not anchor.
            total=$(grep -cE 'error(\[E[0-9]{4}\])?:' "$plain" || true)
            echo "total error lines: $total"
            echo "--- error classes (count, code) ---"
            grep -oE 'error\[E[0-9]{4}\]' "$plain" | sort | uniq -c | sort -rn | head -25 || true
            echo "--- error lines (up to 60, full text) ---"
            grep -E 'error(\[E[0-9]{4}\])?:' "$plain" | head -60 || true
            # Print the GENERATED source at each diagnostic. A type error in
            # emitted Rust is only diagnosable against the code that was emitted,
            # and that crate cannot be regenerated in a dev environment without
            # the disk for it — so the failing lines, and the signature of the
            # function they sit in, have to come back from CI.
            echo "--- generated source at each error ---"
            crate=target/compat-repos/es-toolkit/dist-smelt
            grep -oE '[^[:space:]]+\.rs:[0-9]+' "$plain" | sort -u | while IFS=: read -r f l; do
              src="$crate/$f"
              [ -f "$src" ] || continue
              echo "===== $f:$l ====="
              # Print the WHOLE enclosing function. A truncated line is how the
              # last cycle lost the detail that mattered: the statement filling
              # the offending local ran past the cut. With few errors this is
              # affordable, and it shows the local's declaration, every write to
              # it, and the signature that constrains it.
              awk -v L="$l" '
                { line[NR] = $0 }
                NR <= L && /^[[:space:]]*(pub(\(crate\))?[[:space:]]+)?(async[[:space:]]+)?fn[[:space:]]/ { s = NR }
                END {
                  if (s == 0) { s = (L > 12 ? L - 12 : 1) }
                  for (i = s; i <= NR; i++) {
                    printf "%6d\t%s\n", i, substr(line[i], 1, 1000)
                    if (i > s && line[i] == "}") { break }
                  }
                }
              ' "$src"
            done
            echo "::endgroup::"
          done

      - name: Upload es-toolkit probe + gate artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: es-toolkit-probe
          path: |
            probe.json
            gate-diagnostics.md
            runtime-tests.log
            /tmp/es-toolkit-libcheck.log
            /tmp/es-toolkit-testcheck.log
          if-no-files-found: ignore
