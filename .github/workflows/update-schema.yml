name: Update Smelt.toml schema

on:
  push:
    branches: [main]
    paths:
      - "crates/smelt-transpiler/src/config.rs"

jobs:
  update-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Share the plain debug-build lane used by ci.yml's corpus/regression jobs
      # and compat/library-probes: `cargo run --bin smelt` produces exactly the
      # same artifacts those jobs already cache. Without a shared-key this
      # derived a job-specific lane and always built the workspace cold.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          # Only ever runs on main; be explicit so it cannot write the shared
          # lane from anywhere else.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate schema
        run: cargo run --bin smelt -- dump-schema > smelt-schema.json

      - name: Commit schema
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate smelt-schema.json"
          file_pattern: smelt-schema.json
