name: Publish crates.io release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in [workspace.package]"
        required: true
        type: string
      confirmation:
        description: "Type publish to confirm the crates.io release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirmation == 'publish' }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout the selected ref
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: crates-io-publish

      - name: Verify committed release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          workspace_version="$(sed -n '/^\[workspace\.package\]$/,/^\[/ s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          if [[ -z "$workspace_version" ]]; then
            echo "::error::Could not read workspace.package.version from Cargo.toml"
            exit 1
          fi
          if [[ "$REQUESTED_VERSION" != "$workspace_version" ]]; then
            echo "::error::Requested version $REQUESTED_VERSION does not match committed workspace version $workspace_version"
            exit 1
          fi
          echo "Publishing Smelt crates at $workspace_version"

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: scripts/publish-crates.sh --execute
