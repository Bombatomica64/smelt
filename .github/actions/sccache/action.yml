name: sccache for generated crates
description: Route every rustc this job spawns through sccache, with a disk cache restored from main.

# Tests and library gates spawn `cargo` on GENERATED crates, each in its own
# fresh target directory, so every test used to compile the same registry
# dependencies (tokio, chrono, regex, ...) again: node_parity_tests alone
# rebuilt them for each of its 134 programs. RUSTC_WRAPPER is inherited by
# those nested builds, and sccache is content-addressed (source, flags,
# compiler), so a hit returns exactly what rustc would have produced. A shared
# CARGO_TARGET_DIR could not do this safely: generated crates reuse names, and
# Cargo would hand back another crate's binary.
#
# The cache is only written from main (`save` input); pull requests restore
# main's copy. Pair with ./.github/actions/sccache-save at the end of the job.

inputs:
  lane:
    description: Cache name; one per kind of job, since each compiles a different set.
    required: true

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: taiki-e/install-action@v2
      with:
        tool: sccache

    - name: Configure sccache
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_DIR=$HOME/.cache/sccache"
          echo "SCCACHE_CACHE_SIZE=3G"
          # sccache cannot cache incremental compilations.
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_LANE=${{ inputs.lane }}"
        } >> "$GITHUB_ENV"

    # The registry is cached with the objects: a hit needs the dependency's
    # source at the same path, and the download is otherwise paid per job.
    - name: Restore sccache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/sccache
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: sccache-${{ inputs.lane }}-${{ runner.os }}-${{ github.run_id }}
        restore-keys: sccache-${{ inputs.lane }}-${{ runner.os }}-

    - name: Start sccache
      shell: bash
      run: sccache --start-server
