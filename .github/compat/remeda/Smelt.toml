[project]
name = "remeda-v2-34-1"
version = "2.34.1"
description = "Remeda v2.34.1 full Smelt build probe"

[sources]
roots = ["packages/remeda/src"]
test-prefix = ["**/*.test.ts"]
entries = [
  "packages/remeda/src/index.ts",
]

[output]
target = "./dist-smelt"
crate-name = "remeda_smelt_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
