[project]
name = "hono"
version = "0.0.0"
description = "Hono Smelt probe"

[sources]
roots = ["src"]
entries = ["src/index.ts"]
# Test globs are matched against paths RELATIVE TO EACH SOURCE ROOT (`src`
# here), so this must not repeat the root's own name; `src/**/*.test.ts`
# silently matched nothing. `smelt build`/`probe` now warns about a glob that
# matches no file at all.
test-prefix = ["**/*.test.ts"]
# Excludes are justified one line at a time: each entry names the host surface
# or language feature Smelt's non-DOM Node profile deliberately does not model.
# Remove an entry once Smelt models what it names — never to make a build pass.
#
# The list is short on purpose. The campaign started from the whole of `src/`
# and `smelt check --message-format json` was used to decide what actually
# cannot be in the profile, rather than assuming the obvious candidates: with
# host globals modeled as erased value closures, `src/adapter/**`, `src/jsx/**`
# and `src/helper/{html,css,ssg}` all lower today and are NOT excluded.
#
# `[sources] exclude` prunes the dependency CLOSURE, not only the root set, so
# a module reached transitively is genuinely removed from the crate. Type-only
# imports and `export type` re-exports from an excluded module stay free —
# excluding a module removes its implementation, not its type surface — while
# using an imported *value* reports the exclusion by name.
exclude = [
  # `new Proxy(() => {}, { get })` for dynamic member dispatch (resolving
  # `client.posts.$get` by intercepting property reads) is a Smelt non-goal.
  # `src/index.ts` keeps working: its `export type { InferRequestType, ... }
  # from './client'` is type-only, so it costs nothing.
  "src/client/**",
  # Imports the `hc` VALUE from the excluded client above; it exists to build
  # test clients over that RPC surface, so it cannot outlive it.
  "src/helper/testing/**",
  # `ReadableStream`/`WritableStream`/`TransformStream`: unbounded streaming is
  # not in the standards stream's scope this round. Tracked as future standards
  # work in blocker-logs/hono-fetch-demand.md.
  "src/helper/streaming/**",
  # `WebSocket` and `WebSocketPair`: no WHATWG WebSocket in the profile. Same
  # tracking note as streaming above.
  "src/helper/websocket/**",
  # `crypto.subtle.importKey/sign/verify`, out of scope for the standards
  # stream this round (blocker-logs/hono-fetch-demand.md lists the 19 call
  # sites).
  "src/utils/jwt/**",
  "src/middleware/jwt/**",
  # `vi.stubGlobal` (a monkey-patching model Smelt does not have) plus the
  # `new Proxy` client under test; leaf test files, so droppable.
  "src/client/client.test.ts",
  "src/client/utils.test.ts",
  # `vi.stubGlobal('caches'/'crypto', ...)` (8 call sites): replacing a host
  # global wholesale is the monkey-patching model Smelt does not have.
  "src/middleware/cache/index.test.ts",
  # `vi.stubGlobal` + `vi.unstubAllGlobals` around the service-worker global
  # scope; same monkey-patching model as above.
  "src/adapter/service-worker/handler.test.ts",
  # `vi.spyOn(global.crypto, 'subtle', 'get')` is an accessor spy on a host
  # global: neither the getter form of `vi.spyOn` nor global replacement is
  # modeled.
  "src/middleware/jwk/index.test.ts",
  # `vi.stubEnv` / `vi.unstubAllEnvs`: process-environment mutation is not a
  # modeled host surface (no `vi.stubEnv` member exists in the vitest model).
  "src/helper/dev/index.test.ts",
  "src/middleware/logger/index.test.ts",
  "src/utils/color.test.ts",
  # `vi.spyOn(Date, 'now')`: the runtime models the clock as ambient state
  # driven by `vi.setSystemTime`/`useFakeTimers`, not as a member on `Date`
  # that a spy can replace, so the spy would silently not take effect.
  "src/middleware/timing/index.test.ts",
  # ---------------------------------------------------------------------
  # PHASE 3 PENDING — test files whose own body or import closure hits a
  # blocker family from blocker-logs/hono-phase3-round1-families.md. These
  # are NOT scope decisions: each one leaves this list when its family is
  # fixed. Derived mechanically (`smelt check --message-format json` on the
  # full test closure + the build-only blockers `smelt build` reports), and
  # kept to test files so no library module is pruned. Type-only imports
  # still pull a module into the closure, which is why e.g.
  # `lambda-edge/conninfo.test.ts` is here.
  #
  # Sequential `expect(..).toThrow()` duplicates the continuation: 616 MB
  # module, rustc OOM (round 2 item). phase 3 pending.
  "src/utils/cookie.test.ts",
  # `unknown class method set`: a class FIELD typed as a callable interface
  # (`Context.set`) is not callable yet. phase 3 pending.
  "src/compose.test.ts",
  "src/hono.test.ts",
  "src/types.test.ts",
  "src/helper/factory/index.test.ts",
  "src/middleware/language/index.test.ts",
  "src/middleware/request-id/index.test.ts",
  "src/middleware/secure-headers/index.test.ts",
  # `expect(..).toContain(..)` on an erased actual. phase 3 pending.
  "src/context.test.ts",
  "src/middleware/basic-auth/index.test.ts",
  "src/middleware/bearer-auth/index.test.ts",
  # Unresolved `ReadableStream`/`TransformStream`/`(De)CompressionStream`
  # (the test or a module it reaches). phase 3 pending.
  "src/adapter/aws-lambda/handler.test.ts",
  "src/adapter/lambda-edge/handler.test.ts",
  "src/helper/accepts/accepts.test.ts",
  "src/middleware/body-limit/index.test.ts",
  "src/middleware/compress/index.test.ts",
  "src/middleware/etag/digest.test.ts",
  "src/middleware/etag/index.test.ts",
  "src/middleware/serve-static/index.test.ts",
  "src/utils/stream.test.ts",
  # Unresolved `EventTarget` + adapter modules importing values from the
  # excluded `helper/websocket`. phase 3 pending.
  "src/adapter/bun/websocket.test.ts",
  "src/adapter/cloudflare-workers/websocket.test.ts",
  "src/adapter/deno/websocket.test.ts",
  # Unmodeled runtime globals / host modules reached by the module under
  # test (`Deno`, `navigator`; `node:async_hooks`). phase 3 pending.
  "src/helper/adapter/index.test.ts",
  "src/middleware/context-storage/index.test.ts",
  # Dynamic `import()` is not lowered (in the test or `utils/color.ts`).
  # phase 3 pending.
  "src/jsx/context-isolation.test.ts",
  "src/preset/quick.test.ts",
  "src/preset/tiny.test.ts",
  # `LabeledStatement` is not lowered (`router/linear-router/router.ts`).
  # phase 3 pending.
  "src/router/linear-router/router.test.ts",
  # `Request`/`Response` init is an erased value, so its keys cannot be read
  # with their types. phase 3 pending.
  "src/helper/proxy/index.test.ts",
  "src/middleware/method-override/index.test.ts",
  "src/middleware/pretty-json/index.test.ts",
  # Array/string/index builtins on an erased or optional receiver (string
  # case, `concat`, `splice`, index on Optional). phase 3 pending.
  "src/adapter/lambda-edge/conninfo.test.ts",
  "src/utils/filepath.test.ts",
  "src/utils/ipaddr.test.ts",
  "src/middleware/ip-restriction/index.test.ts",
  "src/middleware/method-not-allowed/index.test.ts",
  # Build-only blockers `smelt check` does not report. phase 3 pending.
  # `list unshift item must match the list element type` (combine):
  "src/middleware/combine/index.test.ts",
  # `new Headers(init)` from an erased initializer (cors):
  "src/middleware/cors/index.test.ts",
  # emitter panic `type table does not contain literal operand type
  # Optional(..)` in `emitter/form_data.rs`:
  "src/utils/buffer.test.ts",
  # Test-shape lowering gaps: `call expression is not lowered yet`,
  # non-direct `describe` bodies, `expect(..)` modifiers other than `.not`,
  # `.resolves` on a non-Promise actual (+ `declare` methods), callback
  # methods (`safe_parse`) inside closures. phase 3 pending.
  "src/jsx/utils.test.ts",
  "src/router/reg-exp-router/prepared-router.test.ts",
  "src/utils/types.test.ts",
  "src/request.test.ts",
  "src/adapter/cloudflare-pages/handler.test.ts",
  "src/validator/validator.test.ts",
  # Tagged templates with a user-defined tag (+ assignment-target gap in
  # `helper/html`). phase 3 pending.
  "src/helper/html/index.test.ts",
  # The `jsx/**` runtime closure (10 modules, ~15 classes: see families).
  # phase 3 pending.
  "src/jsx/children.test.ts",
  # `Object.assign` with no source record. phase 3 pending.
  "src/middleware/csrf/index.test.ts",
  # ---- Test files that lower but break the phase-2 `cargo check` gate by
  # pulling library modules into the crate with generated-Rust errors
  # (measured on the 99-module build: 125 errors, table in hono-current.md).
  #
  # Hono's `Context` class collides with `router/reg-exp-router/node.ts`'s
  # `Context` interface (renamed `Context_1`); once a test constructs
  # `new Context(req, ..)` the class carries its `E` type argument and the
  # type-position spelling in `compose.rs`/`hono_base.rs` is emitted as the
  # UNRENAMED `Context<SmeltUnknown>` (E0107 + E0308 `Context` vs
  # `Context_1`; cross-kind name collision with type arguments).
  # phase 3 pending.
  "src/adapter/aws-lambda/conninfo.test.ts",
  "src/adapter/bun/conninfo.test.ts",
  "src/adapter/bun/server.test.ts",
  "src/adapter/cloudflare-pages/conninfo.test.ts",
  "src/adapter/cloudflare-workers/conninfo.test.ts",
  "src/adapter/deno/conninfo.test.ts",
  "src/adapter/netlify/conninfo.test.ts",
  "src/adapter/vercel/conninfo.test.ts",
  "src/helper/route/index.test.ts",
  # Same collision, plus 28 E0308s in `middleware/serve-static/index.ts`
  # (`Option<f64>` vs `SmeltResponse`). phase 3 pending.
  "src/adapter/cloudflare-workers/serve-static.test.ts",
  # Reach library modules with generated-Rust errors: `utils/accept.ts`
  # (E0308 tuple `Option<Accept>`), `utils/basic-auth.ts` (E0308
  # `SmeltMatch`), `utils/concurrent.ts` (E0425 capture name, E0605, E0308
  # future nesting), `helper/cookie` + `utils/cookie.ts` (E0425 temp,
  # E0605, E0308 record value type). phase 3 pending.
  "src/utils/accept.test.ts",
  "src/utils/basic-auth.test.ts",
  "src/utils/concurrent.test.ts",
  "src/helper/cookie/index.test.ts",
  # Pulls in `middleware/trailing-slash/index.ts`, which emits a 3 MB /
  # 11k-line module from a 158-line source; plain `cargo check` (no tests)
  # is SIGKILLed at >11 GB RSS within 40 s. phase 3 pending.
  "src/middleware/trailing-slash/index.test.ts",
]

[output]
target = "./dist-smelt"
crate-name = "hono_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
