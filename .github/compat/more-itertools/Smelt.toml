[project]
name = "more-itertools"
version = "0.0.0"
description = "more-itertools Smelt probe"

[sources]
roots = ["."]
test-prefix = ["tests/**/test_*.py"]
entries = ["more_itertools/__init__.py"]

[output]
target = "./dist-smelt"
crate-name = "more_itertools_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
