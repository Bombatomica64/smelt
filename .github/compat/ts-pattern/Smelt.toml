[project]
name = "ts-pattern"
version = "0.0.0"
description = "ts-pattern Smelt probe"

[sources]
roots = ["src", "tests"]
test-prefix = ["**/*.test.ts"]
entries = ["src/index.ts"]

[output]
target = "./dist-smelt"
crate-name = "ts_pattern_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
