[project]
name = "funcy"
version = "0.0.0"
description = "funcy Smelt probe"

[sources]
roots = ["."]
test-prefix = ["tests/**/test_*.py"]
entries = ["funcy/__init__.py"]

[output]
target = "./dist-smelt"
crate-name = "funcy_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
