[project]
name = "date-fns"
version = "4.4.0"
description = "date-fns Smelt probe"

# date-fns v4.4.0 is a pnpm monorepo; the `date-fns` package itself lives in
# `pkgs/core`, so that is the only root. No `test-prefix`, and excludes only for
# what Smelt does not model, so the probe records the real first whole-crate abort.
# blocker-logs/probe-date-fns.md lists the scratch excludes that reach an
# emitted crate and why (194 of 253 `test.ts` specs import `TZDate`/`UTCDate`
# from the sibling `@date-fns/tz`/`@date-fns/utc` packages, which are
# JavaScript behind hand-written `.d.ts`).
[sources]
roots = ["pkgs/core/src"]
entries = ["pkgs/core/src/index.ts"]
test-globs = ["**/test.ts"]
# The CI job deletes, in its disposable clone, the 194 specs that import the
# sibling `@date-fns/tz`/`@date-fns/utc` packages (see the note above); the
# spec excludes here are the remaining ones that test what is not modeled.
exclude = [
  # Imports `fp-ts`, `js-fns` and `lodash`, which the clone does not install.
  "pkgs/core/src/fp/_lib/convertToFP/test.ts",
  # Tests `intlFormat`, excluded below.
  "pkgs/core/src/intlFormat/test.ts",
  # `Intl.DateTimeFormat` / `Intl.RelativeTimeFormat` have no model: they need a
  # locale-aware formatter behind `format`, `formatToParts` and `resolvedOptions`.
  "pkgs/core/src/intlFormat/index.ts",         # new Intl.DateTimeFormat(locale, options).format(date)
  "pkgs/core/src/intlFormatDistance/index.ts", # new Intl.RelativeTimeFormat(locale, options).format(value, unit)
]

[output]
target = "./dist-smelt"
crate-name = "date_fns_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
