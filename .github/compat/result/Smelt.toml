[project]
name = "result"
version = "0.0.0"
description = "result Smelt probe"

[sources]
roots = ["src", "tests"]
test-prefix = ["**/test_*.py"]
entries = ["src/result/__init__.py"]

[output]
target = "./dist-smelt"
crate-name = "result_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
