[project]
name = "radash"
version = "0.0.0"
description = "radash Smelt probe"

[sources]
roots = ["src"]
test-prefix = ["tests/**/*.test.ts"]
entries = ["src/index.ts"]

[output]
target = "./dist-smelt"
crate-name = "radash_probe"
build = false

[rust]
edition = "2024"

[strict]
typescript = true
python = true

[runtime]
clone-strategy = "aggressive"
