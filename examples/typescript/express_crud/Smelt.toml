[project]
name = "express_crud"
version = "0.1.0"
description = "An Express 5 todo CRUD API smelted into an axum server"

[sources]
# Entry points. smelt walks imports from here to discover the rest.
entries = ["src/main.ts"]
# Optional: extra roots searched during import resolution.
roots = ["src"]

[output]
target = "./dist-smelt"
crate-name = "express_crud"
# If true, smelt also runs `cargo build` after emitting.
build = false

[rust]
edition = "2024"

[rust.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[strict]
# v1.0: both flags must be true. Non-strict mode is not supported.
typescript = true
python = true

[runtime]
# v1.0 only supports "aggressive". Reserved for v2.0.
clone-strategy = "aggressive"
