[project]
name = "hono_crud"
version = "0.1.0"
description = "A Hono 4 todo CRUD API smelted into an axum server"

[sources]
# Entry points. smelt walks imports from here to discover the rest.
entries = ["src/main.ts"]
# Optional: extra roots searched during import resolution. `test/` holds the
# vitest suite, which `test-prefix` turns into the generated crate's `cargo test`.
roots = ["src", "test"]
test-prefix = ["**/*.test.ts"]

# `hono` from npm ships compiled JavaScript only; Smelt lowers the TypeScript
# source of the same release, the version package.json resolves to on Node.
# The RPC client (`new Proxy`) and the testing helper are not used by this app
# and are outside Smelt's profile, as in .github/compat/hono/Smelt.toml.
[packages.hono]
git = "https://github.com/honojs/hono.git"
rev = "v4.13.7"
exclude = ["src/client/**", "src/helper/testing/**"]

[output]
target = "./dist-smelt"
crate-name = "hono_crud"
# If true, smelt also runs `cargo build` after emitting.
build = false

[rust]
edition = "2024"

[rust.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[strict]
# v1.0: both flags must be true. Non-strict mode is not supported.
typescript = true
python = true

[runtime]
# v1.0 only supports "aggressive". Reserved for v2.0.
clone-strategy = "aggressive"
